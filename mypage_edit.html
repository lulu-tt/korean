<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지역어종합정보 — 나의 정보 수정</title>
<link rel="shortcut icon" href="./favicon.ico">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="./styles.css">
<script src="./gnb.js" defer></script>
<script src="./share.js" defer></script>
<script src="./footer.js" defer></script>
<style>
  :root { --rg: #2563eb; --rg-dark: #1d4ed8; }

  body {
    background: #ffffff;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    margin: 0;
  }

  .rg-wrap {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 10px 20px 110px;
    flex: 1;
    box-sizing: border-box;
  }

  /* 안내 배너 */
  .rg-notice {
    display: flex; align-items: flex-start; gap: 10px;
    background: #eff4ff; border-radius: 14px;
    padding: 20px 24px; margin: 0 0 44px;
    font-size: 14.5px; color: #3f5170; line-height: 1.6;
  }
  .rg-notice i { color: var(--rg); font-size: 20px; margin-top: 1px; flex-shrink: 0; }

  /* 섹션 헤더 */
  .rg-section-title {
    font-size: 21px; font-weight: 800; color: #1e293b; letter-spacing: -0.02em;
    padding-bottom: 18px; border-bottom: 2px solid #1e293b; margin: 0 0 8px;
  }
  .rg-section-title.mt { margin-top: 60px; }
  .rg-required-note { font-size: 13.5px; color: #64748b; margin: 16px 0 30px; }
  .rg-required-note b { color: #e11d48; font-weight: 700; }

  /* 정보 입력 필드 */
  .rg-fields { margin-top: 4px; }
  .rg-field { margin-bottom: 34px; }
  .rg-field:last-child { margin-bottom: 0; }
  .rg-field__label { display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 700; color: #1e293b; margin-bottom: 12px; }
  .rg-req { color: #e11d48; font-size: 13px; font-weight: 700; }
  .rg-field__control { display: flex; gap: 10px; align-items: center; }
  .rg-input {
    flex: 1; min-width: 0; height: 56px; padding: 0 18px;
    border: 1px solid #d7dbe0; border-radius: 12px; font-size: 15px; color: #1e293b;
    box-sizing: border-box; font-family: inherit; transition: 0.15s; background: #fff;
  }
  .rg-input::placeholder { color: #9aa3af; }
  .rg-input:focus { outline: none; border-color: var(--rg); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); }
  .rg-input:disabled, .rg-input[readonly] {
    background: #f4f6f9; color: #64748b; cursor: default; border-color: #e2e8f0;
  }
  .rg-field__hint { font-size: 13px; color: #94a3b8; margin: 10px 2px 0; }

  /* 하단 버튼 */
  .rg-actions { display: flex; justify-content: center; gap: 12px; margin-top: 52px; }
  .rg-btn {
    min-width: 168px; height: 58px; padding: 0 30px; background: var(--rg); color: #fff;
    border: none; border-radius: 12px; font-size: 16.5px; font-weight: 700; cursor: pointer;
    transition: background 0.2s; font-family: inherit; display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
  }
  .rg-btn:hover { background: var(--rg-dark); }
  .rg-btn--ghost { background: #fff; color: #475569; border: 1px solid #cbd5e1; }
  .rg-btn--ghost:hover { background: #f1f5f9; }

  /* 완료 화면 */
  #editDone[hidden] { display: none; }
  .rg-done { text-align: center; padding: 40px 20px 10px; }
  .rg-done__icon { width: 96px; height: 96px; border-radius: 50%; background: rgba(37, 99, 235, 0.08); color: var(--rg); display: grid; place-items: center; font-size: 50px; margin: 0 auto 26px; }
  .rg-done__title { font-size: 26px; font-weight: 800; color: #1e293b; margin: 0 0 14px; letter-spacing: -0.02em; }
  .rg-done__desc { font-size: 15.5px; color: #64748b; margin: 0 0 40px; line-height: 1.7; }

  @media (max-width: 720px) {
    .rg-section-title { font-size: 18px; }
    .rg-field__control { flex-wrap: wrap; }
    .rg-actions { flex-direction: column-reverse; }
    .rg-btn { width: 100%; }
  }
</style>
</head>
<body>

<div id="gnb-common"></div>

<div class="sub-visual">
  <div class="wrap">
    <h1 class="sv-title">나의 정보 수정</h1>
    <div class="location-bar">
      <div class="loc-item home" onclick="location.href='./index.html'" style="cursor:pointer;" aria-label="처음으로"><i class="ti ti-home" aria-hidden="true"></i></div>
      <i class="ti ti-chevron-right loc-sep"></i>
      <div class="loc-item">내정보</div>
      <i class="ti ti-chevron-right loc-sep"></i>
      <div class="loc-item">
        <select onchange="if(this.value) location.href=this.value;">
          <option value="./mypage_edit.html" selected>나의 정보 수정</option>
          <option value="./mypage_opinion.html">나의 의견 제시</option>
          <option value="./mypage_map.html">나의 지도</option>
          <option value="./mypage_withdraw.html">회원탈퇴</option>
        </select>
      </div>
    </div>
  </div>
</div>

<div class="rg-wrap">
  <!-- 안내 배너 -->
  <div class="rg-notice">
    <i class="ti ti-shield-check" aria-hidden="true"></i>
    <span>지역어 종합 정보는 회원님의 개인정보를 안전하게 보호하고 있으며, 회원님의 명백한 동의 없이는 공개하거나 제3자에게 제공하지 않습니다.</span>
  </div>

  <div id="editForm">
    <!-- 회원 정보 -->
    <h2 class="rg-section-title">회원 정보 수정</h2>
    <p class="rg-required-note"><b>필수</b> 표시가 있는 항목은 반드시 입력해야 합니다.</p>

    <div class="rg-fields">
      <div class="rg-field">
        <label class="rg-field__label" for="edId">계정(ID)</label>
        <div class="rg-field__control">
          <input type="text" id="edId" class="rg-input" value="hanguk_user" readonly>
        </div>
        <p class="rg-field__hint">계정(ID)은 변경할 수 없습니다.</p>
      </div>

      <div class="rg-field">
        <label class="rg-field__label" for="edNick">별명 <span class="rg-req">필수</span></label>
        <div class="rg-field__control">
          <input type="text" id="edNick" class="rg-input" value="지역어사랑" placeholder="별명을 입력하세요.">
        </div>
      </div>

      <div class="rg-field">
        <label class="rg-field__label" for="edPw">비밀번호 수정 <span class="rg-req">필수</span></label>
        <div class="rg-field__control">
          <input type="password" id="edPw" class="rg-input" placeholder="새 비밀번호를 입력하세요.">
        </div>
        <p class="rg-field__hint">영문자, 숫자, 특수 문자(2가지 이상)의 조합 10자 이상</p>
      </div>

      <div class="rg-field">
        <label class="rg-field__label" for="edPw2">비밀번호 확인 <span class="rg-req">필수</span></label>
        <div class="rg-field__control">
          <input type="password" id="edPw2" class="rg-input" placeholder="새 비밀번호를 한 번 더 입력하세요.">
        </div>
      </div>
    </div>

    <div class="rg-actions">
      <a href="./index.html" class="rg-btn rg-btn--ghost">취소</a>
      <button type="button" class="rg-btn" onclick="submitEdit()">저장</button>
    </div>
  </div>

  <!-- 정보 수정 완료 -->
  <div id="editDone" hidden>
    <div class="rg-done">
      <div class="rg-done__icon"><i class="ti ti-circle-check"></i></div>
      <p class="rg-done__title">회원 정보가 수정되었습니다.</p>
      <p class="rg-done__desc">변경하신 정보가 정상적으로 저장되었습니다.</p>
      <div class="rg-actions" style="margin-top:0;">
        <a href="./index.html" class="rg-btn rg-btn--ghost">메인으로</a>
        <a href="./mypage_edit.html" class="rg-btn">내정보로</a>
      </div>
    </div>
  </div>
</div>

<div id="footer-common"></div>

<script>
  function submitEdit() {
    var nick = document.getElementById('edNick').value.trim();
    var pw = document.getElementById('edPw').value;
    var pw2 = document.getElementById('edPw2').value;
    if (!nick) { alert('별명을 입력해 주세요.'); return document.getElementById('edNick').focus(); }
    if (pw || pw2) {
      if (!pw) { alert('새 비밀번호를 입력해 주세요.'); return document.getElementById('edPw').focus(); }
      if (pw !== pw2) { alert('비밀번호가 일치하지 않습니다.'); return document.getElementById('edPw2').focus(); }
    }
    document.getElementById('editForm').hidden = true;
    document.getElementById('editDone').hidden = false;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>

</body>
</html>
