		<script>

		$(function () {

			

			readyInit();	//최초 시작할 init
			$("#neibisTopTitle").text("NEIBIS | 로그인");
		});

		const loginAction = function(e){
			if($("#inputKeep").is(":checked")){
				localStorage.setItem("idSave", $("#userId").val());
			}else{
				localStorage.removeItem("idSave");
			}

			let value = new NeibisValidator();
				value.add("userId", {required: true});
				value.add("userPw", {required: true});

			let result = value.validate();
			if(!result){
				$(".text-guide").show();
				//$("label[for="+value.getErrorElement().id+"]").closest("div").append('<p class="text-guide text-invalid"><span>'+value.getErrorMessage()+'</span></p>');
				$("#message-area").text(value.getErrorMessage());
				value.getErrorElement().focus();
				return false;
			}else{
				let param = paramBinding();
				Ajax.post("/mariadb/neibis-api/v1/core/login",success,fail,{data:JSON.stringify(param)});
			}
		}

		const enterAction = function(e){
			if(e.keyCode == 13){
				$("#login-button").trigger("click");
			}
		}

		const readyInit = function(){
			$(".text-guide").hide();
			if(localStorage.getItem("idSave")){
				$("#userId").val(localStorage.getItem("idSave"));
				$("#inputKeep").prop("checked",true);
			}
			ActionInit.click("#login-button",loginAction);
			ActionInit.keydown("#userPw",enterAction);
		}

		const paramBinding = function(){
			var obj = new Object();
		//	var rsa = new RSAKey();
		//	rsa.setPublic($('#RSAModulus').val(),$('#RSAExponent').val());
			
			obj.mngrCntnId = $("#userId").val();
		//	obj.mngrPswdVl = rsa.encrypt($("#userPw").val());
			obj.mngrPswdVl = $("#userPw").val();
			return obj;
		}

		const success = function(data){
			Message.success(data,function(){
				window.location.href="../../mariadb/neibis/index.html";
			});
		}

		const fail = function(xhr, status, error){
			Message.fail(xhr, status, error,function(){
				window.location.reload();
			})
		}
		
		var prevMessage;
		function checkCapsLock(event) {
			let message = 'Caps Lock이 켜져있어요';
			
			if(typeof event.key !== "undefined"){
			    const isCapsLock = event.getModifierState('CapsLock');
			    const tmpMessage = $("#message-area").text();
			    
			    if(tmpMessage && tmpMessage != message) {
		    		prevMessage = $("#message-area").text();
		    	}
			    
			    if (isCapsLock) {
			    	$("#message-area").text(message);
			    	$("#capsLockWarning").show();
			    } else if(prevMessage){
			    	$("#message-area").text(prevMessage);
			    	$("#capsLockWarning").show();
			    } else {
			    	$("#capsLockWarning").hide();
			    	prevMessage='';
			    }
			}
		}
		 
		document.getElementById('userId').addEventListener('keyup', checkCapsLock);
		document.getElementById('userPw').addEventListener('keyup', checkCapsLock);

		</script>
