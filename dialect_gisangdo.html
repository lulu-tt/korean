    /* ── 지도(MapAdapter) §7 — 공통 지도(KoreaMap) 재사용 ─────── */
    const PROV2CODE = {
      '경기도':'GG','서울특별시':'GG','인천광역시':'GG',
      '강원도':'GW',
      '충청북도':'CB',
      '충청남도':'CN','대전광역시':'CN','세종특별자치시':'CN',
      '경상북도':'GB','대구광역시':'GB',
      '경상남도':'GN','부산광역시':'GN','울산광역시':'GN',
      '전라북도':'JB',
      '전라남도':'JN','광주광역시':'JN',
      '제주특별자치도':'JJ'
    };
    const MAP_CENTER=[127.85,36.15], MAP_ZOOM=7.25;   // 지도 기본 위치(초기화 기준)
    // 9권역 중심 좌표(경도,위도) — 날씨 이모지 마커 위치
    const CENTROID = {
      GG:[127.05,37.40], GW:[128.30,37.75], CB:[127.75,36.80], CN:[126.75,36.50],
      GB:[128.75,36.35], GN:[128.20,35.30], JB:[127.10,35.70], JN:[126.90,34.85], JJ:[126.55,33.40]
    };
    // 실제 폴리곤 기하로부터 계산한 각 도의 내부 중심점(지도 투영 좌표) — 마커를 지역 중앙에 배치
    const AUTO_CENTROID = {};
    // 마커 미세 조정(투영 좌표 오프셋, px 아님) — 인접 도 라벨 겹침/치우침 보정
    // 마커 미세 이동(투영 좌표, x+ 오른쪽 / y- 아래). 경기 제외 8개 도를 우하향으로 소폭 이동.
    // 충남·충북은 라벨 분리 오프셋에 우하향 이동을 합산.
    const CENTROID_NUDGE = {
      GW:[9000,-9000], CB:[22000,-6000], CN:[-4000,-11000],
      GB:[9000,-9000], GN:[9000,-9000], JB:[9000,-9000],
      JN:[9000,-9000], JJ:[9000,-9000]
    };
    // 마커 위치: 계산된 폴리곤 중심 우선, 없으면 하드코딩 CENTROID(경위도) 폴백
    function markerCoord(code){
      const base = AUTO_CENTROID[code] || (CENTROID[code] ? ol.proj.fromLonLat(CENTROID[code]) : null);
      if(!base) return null;
      const n = CENTROID_NUDGE[code];
      return n ? [base[0]+n[0], base[1]+n[1]] : base;
    }
    // GeoJSON 지오메트리의 위도 중심(남/북한 강원도 구분용)
    function geoLatCenter(geom){
      let minY=Infinity, maxY=-Infinity;
      (function scan(a){ if(typeof a[0]==='number'){ if(a[1]<minY)minY=a[1]; if(a[1]>maxY)maxY=a[1]; } else a.forEach(scan); })(geom.coordinates);
      return (minY+maxY)/2;
    }
    let olMap=null, playTimer=null;

    // 사양서 §7.1 인터페이스를 공통 지도(KoreaMap)에 맞춰 구현
    function createMapAdapter(targetEl){
      if(!window.ol || !window.KoreaMap || !window.KOREA_PROVINCES) return null;
      let fillLayer=null;   // 지도별 지역 변수(다중 지도 공존 대비)
      const feats = window.KOREA_PROVINCES.features
        .filter(f=>PROV2CODE[f.properties.name])
        // 북한 강원도(동명 피처)는 제외 — 남한 데이터만 색칠 (위도 중심 38.6°N 이북 컷)
        .filter(f=> !(f.properties.name==='강원도' && geoLatCenter(f.geometry) > 38.6))
        .map(f=>({ type:'Feature', properties:{name:f.properties.name, color:'#e5e7eb'}, geometry:f.geometry }));
      const geo = { type:'FeatureCollection', features:feats };

      const base = window.KoreaMap.createBaseLayer({ fill:'#eef2f6', stroke:'#c7d0da', strokeWidth:1 });
      fillLayer = window.KoreaMap.createFillLayer(geo, { colorProp:'color', fillAlpha:0.78, strokeAlpha:0.9, strokeWidth:1.1, zIndex:3 });
      if(!fillLayer) return null;

      // 각 도의 폴리곤 내부 중심점 계산 → 마커를 지역 중앙에 정렬.
      // 한 코드에 여러 피처(예: GG=경기도+서울+인천)가 있으면 '가장 큰 피처(=실제 도)'를 기준으로 삼는다.
      try{
        const bestArea = {};
        fillLayer.getSource().getFeatures().forEach(ft=>{
          const code = PROV2CODE[ft.get('name')]; if(!code) return;
          const g = ft.getGeometry(); if(!g) return;
          let poly = null;
          if(g.getType()==='Polygon') poly = g;
          else if(g.getType()==='MultiPolygon'){ let ba=-1; g.getPolygons().forEach(p=>{ const a=p.getArea(); if(a>ba){ ba=a; poly=p; } }); }
          if(!poly) return;
          const area = poly.getArea();
          if(area > (bestArea[code]||0)){ bestArea[code]=area; AUTO_CENTROID[code]=poly.getInteriorPoint().getCoordinates().slice(0,2); }
        });
      }catch(e){ /* 계산 실패 시 CENTROID 폴백 사용 */ }

      const map = new ol.Map({
        target: targetEl,
        layers: base ? [base, fillLayer] : [fillLayer],
        view: window.KoreaMap.createView({ center:MAP_CENTER, zoom:MAP_ZOOM, minZoom:6, maxZoom:9 }),
        controls: []
      });

      let markers=[];   // 날씨 이모지 오버레이

      return {
        map,
        setRegionFill(code,color){
          fillLayer.getSource().getFeatures().forEach(ft=>{
            if(PROV2CODE[ft.get('name')]===code) ft.set('color', color);
          });
        },
        // dialect_awareness.html과 동일한 이모지 날씨 마커를 각 권역 중심에 표시
        setWeatherMarkers(w, gen){
          markers.forEach(o=>map.removeOverlay(o)); markers=[];
          REGION_ORDER.forEach(code=>{
            const c=markerCoord(code); if(!c) return;
            const rate=(w.byRegion[gen]||{})[code];
            const wk=weatherOf(rate).key;
            const el=document.createElement('div');
            el.className='gs-olmarker';
            el.innerHTML=`<div class="gs-olring"><div class="gs-olemoji">${EMOJI[wk]}</div><div class="gs-ollabel"><span class="nm">${REGION_NAMES[code]||code}</span> <span class="gs-olpct gs-fc--${wk}">${pct(rate)}%</span></div></div>`;
            const ov=new ol.Overlay({ element:el, stopEvent:false, positioning:'center-center' });
            ov.setPosition(c);
            map.addOverlay(ov); markers.push(ov);
          });
        },
        // 범용 마커: builder(code)가 HTML 문자열(또는 null) 반환 — 계열 지도 등 재사용
        setCustomMarkers(builder){
          markers.forEach(o=>map.removeOverlay(o)); markers=[];
          REGION_ORDER.forEach(code=>{
            const c=markerCoord(code); if(!c) return;
            const html=builder(code); if(html==null) return;
            const el=document.createElement('div'); el.className='gs-olmarker'; el.innerHTML=html;
            const ov=new ol.Overlay({ element:el, stopEvent:false, positioning:'center-center' });
            ov.setPosition(c); map.addOverlay(ov); markers.push(ov);
          });
        },
        onRegionClick(handler){
          map.on('click', evt=>{
            const ft = map.forEachFeatureAtPixel(evt.pixel, f=>f);
            if(ft){ const code=PROV2CODE[ft.get('name')]; if(code) handler(code, evt); }
            else hidePopover();
          });
        },
        setFillVisible(v){ fillLayer.setVisible(v); },
        setMarkersVisible(v){ markers.forEach(o=>{ const el=o.getElement(); if(el) el.style.display = v?'':'none'; }); },
        target: targetEl,
        clear(){ if(olMap){ olMap.setTarget(undefined); olMap=null; } }
      };
    }

    function paintMap(adapter, w, gen){
      REGION_ORDER.forEach(code=>{
        const rate = (w.byRegion[gen]||{})[code];
        adapter.setRegionFill(code, HEXVAR[weatherOf(rate).key]);
      });
      adapter.setWeatherMarkers(w, gen);
    }

    function initMap(w){
      const target=document.getElementById('gs-map');
      if(!target) return;
      if(olMap){ olMap.setTarget(undefined); olMap=null; }
      stopPlay();

      const adapter=createMapAdapter(target);
      if(!adapter){
        const fb=document.getElementById('gsMapFallback');
        if(fb){ fb.style.display='flex';
          fb.innerHTML = '지도를 불러오지 못했습니다. 지역별 사용률(20대): '
            + REGION_ORDER.map(c=>`${REGION_NAMES[c]} ${pct(w.byRegion[20][c])}%`).join(' · '); }
        return;
      }
      olMap=adapter.map;
      paintMap(adapter, w, currentGen);

      adapter.onRegionClick((code, evt)=> showPopover(w, code, evt));

      // 지도 위치 초기화
      const reset=document.getElementById('gsMapReset');
      if(reset) reset.addEventListener('click',()=>{
        const v=adapter.map.getView(); hidePopover();
        v.animate({ center: ol.proj.fromLonLat(MAP_CENTER), zoom: MAP_ZOOM, duration:300 });
      });

      // 세대 스위치
      const sw=document.getElementById('gsGenSwitch');
      if(sw) sw.querySelectorAll('button').forEach(b=>{
        b.classList.toggle('is-active', +b.dataset.gen===currentGen);
        b.addEventListener('click',()=>{
          currentGen=+b.dataset.gen;
          sw.querySelectorAll('button').forEach(x=>x.classList.toggle('is-active',x===b));
          paintMap(adapter,w,currentGen); hidePopover();
        });
      });
      // 전선 남하 재생 (70→50→20) — prefers-reduced-motion 존중
      const play=document.getElementById('gsPlay');
      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if(play) play.addEventListener('click',()=>{
        if(playTimer){ stopPlay(); return; }
        if(reduce){ currentGen=20; syncGenSwitch(); paintMap(adapter,w,20); return; }
        const seq=[70,50,20]; let i=0;
        play.innerHTML='<i class="ti ti-player-stop"></i> 정지';
        const step=()=>{ currentGen=seq[i]; syncGenSwitch(); paintMap(adapter,w,currentGen); hidePopover();
          i=(i+1)%seq.length; playTimer=setTimeout(step, i===0?1700:1100); };
        step();
      });

      wireMapToolbar(adapter, w);
    }

    /* ── 지도 도구모음 (지도 설정 / 공유 / 다운로드) ─────────────── */
    function wireMapToolbar(adapter, w){
      const $=id=>document.getElementById(id);
      const closeAllPop=()=>document.querySelectorAll('#jiyeoeo-gisangdo-root .gs-popmenu').forEach(p=>p.hidden=true);
      const bindPop=(btnId,popId)=>{ const b=$(btnId),p=$(popId); if(!b||!p) return;
        b.addEventListener('click',e=>{ e.stopPropagation(); const open=p.hidden; closeAllPop(); p.hidden=!open; b.setAttribute('aria-expanded',String(open)); });
        p.addEventListener('click',e=>e.stopPropagation());
      };
      bindPop('gsBtnSettings','gsPopSettings');
      bindPop('gsBtnDownload','gsPopDownload');

      // 지도 레이어(하천·철도·도로·산맥) — KoreaMap.attachOverlays
      let overlays=null, regionCtl=null;
      const ensureOverlays=()=>{ if(!overlays && window.KoreaMap && window.KoreaMap.attachOverlays) overlays=window.KoreaMap.attachOverlays(adapter.map); return overlays; };
      [['gsOvRivers','rivers'],['gsOvRail','rail'],['gsOvRoads','roads'],['gsOvMountains','mountains']].forEach(([id,key])=>{
        const cb=$(id); if(cb) cb.addEventListener('change',()=>{ const ov=ensureOverlays(); if(ov) ov.show(key, cb.checked); });
      });
      const ensureRegionCtl=()=>{ if(!regionCtl && window.KoreaMap && window.KoreaMap.attachRegionLayers) regionCtl=window.KoreaMap.attachRegionLayers(adapter.map,{sidoVisible:false,sigunguVisible:false}); return regionCtl; };
      const lblSido=$('gsLblSido');
      if(lblSido) lblSido.addEventListener('change',()=>{ const c=ensureRegionCtl(); if(c) c.showSido(lblSido.checked); });
      const lblSigungu=$('gsLblSigungu');
      if(lblSigungu) lblSigungu.addEventListener('change',()=>{ const c=ensureRegionCtl(); if(c) c.showSigungu(lblSigungu.checked); });
      const hideIcon=$('gsHideIcon'); if(hideIcon) hideIcon.addEventListener('change',()=>adapter.setMarkersVisible(!hideIcon.checked));
      const hideArea=$('gsHideArea'); if(hideArea) hideArea.addEventListener('change',()=>adapter.setFillVisible(!hideArea.checked));

      // 공유 — 현재 단어 링크 복사
      const share=$('gsBtnShare');
      if(share) share.addEventListener('click',()=>{
        const url=location.href.split('#')[0]+'#/word/'+currentWordId;
        if(navigator.clipboard) navigator.clipboard.writeText(url).catch(()=>{});
        showToast('현재 단어 기상도 링크를 복사했습니다.');
      });

      // 다운로드 — PNG / 인쇄용
      const dlImage=$('gsDlImage');
      if(dlImage) dlImage.addEventListener('click',()=>{ closeAllPop(); withMapCanvas(adapter, w, cv=>triggerDownload(cv.toDataURL('image/png'), `지역어기상도_${w.standard}_${currentGen}대.png`)); });
      const dlPdf=$('gsDlPdf');
      if(dlPdf) dlPdf.addEventListener('click',()=>{ closeAllPop(); withMapCanvas(adapter, w, cv=>{
        const url=cv.toDataURL('image/png'); const win=window.open('','_blank');
        if(!win){ alert('팝업이 차단되어 인쇄 창을 열 수 없습니다.'); return; }
        win.document.write(`<html><head><title>지역어 기상도 - ${w.standard}</title></head><body style="margin:0"><img src="${url}" style="width:100%" onload="setTimeout(function(){window.focus();window.print();},300)"></body></html>`);
        win.document.close();
      }); });
    }

    // OL 캔버스 + 이모지·제목을 하나의 캔버스로 합성
    function withMapCanvas(adapter, w, cb){
      const olm=adapter.map, target=adapter.target; if(!olm||!target) return;
      olm.once('rendercomplete',()=>{
        const size=olm.getSize();
        const out=document.createElement('canvas'); out.width=size[0]; out.height=size[1];
        const ctx=out.getContext('2d');
        ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,out.width,out.height);
        target.querySelectorAll('canvas').forEach(cv=>{
          if(cv.width===0) return;
          const op=cv.parentNode.style.opacity||cv.style.opacity;
          ctx.globalAlpha = op===''?1:Number(op);
          const m=/^matrix\(([^)]*)\)$/.exec(cv.style.transform);
          if(m){ const v=m[1].split(',').map(Number); ctx.setTransform(v[0],v[1],v[2],v[3],v[4],v[5]); }
          else ctx.setTransform(1,0,0,1,0,0);
          ctx.drawImage(cv,0,0);
        });
        ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1;
        // 날씨 이모지 + 사용률
        const hideIcon=document.getElementById('gsHideIcon');
        if(!(hideIcon&&hideIcon.checked)){
          ctx.textAlign='center'; ctx.textBaseline='middle';
          REGION_ORDER.forEach(code=>{
            const c=markerCoord(code); if(!c) return;
            const px=olm.getPixelFromCoordinate(c); if(!px) return;
            const rate=(w.byRegion[currentGen]||{})[code]; const wk=weatherOf(rate).key;
            ctx.font='26px sans-serif'; ctx.fillStyle='#000'; ctx.fillText(EMOJI[wk], px[0], px[1]-6);
            ctx.font='bold 12px sans-serif'; ctx.lineWidth=3; ctx.strokeStyle='rgba(255,255,255,.92)';
            ctx.strokeText(pct(rate)+'%', px[0], px[1]+16);
            ctx.fillStyle='#0f172a'; ctx.fillText(pct(rate)+'%', px[0], px[1]+16);
          });
        }
        // 제목 · 출처
        ctx.textAlign='left'; ctx.textBaseline='alphabetic';
        ctx.fillStyle='#0f172a'; ctx.font='bold 18px sans-serif';
        ctx.fillText(`'${w.standard}' 방언 기상도 · ${currentGen}대`, 16, 28);
        ctx.fillStyle='#64748b'; ctx.font='12px sans-serif';
        ctx.fillText('국립국어원 · 지역어 기상도', 16, size[1]-14);
        cb(out);
      });
      olm.renderSync();
    }
    function triggerDownload(href, filename){
      const a=document.createElement('a'); a.href=href; a.download=filename;
      document.body.appendChild(a); a.click(); a.remove();
    }
    let _toast=null;
    function showToast(msg){
      const root=document.getElementById('jiyeoeo-gisangdo-root'); if(!root) return;
      if(!_toast){ _toast=document.createElement('div'); _toast.className='gs-toast'; root.appendChild(_toast); }
      _toast.innerHTML=`<i class="ti ti-check" aria-hidden="true"></i> ${msg}`;
      _toast.classList.add('is-show');
      clearTimeout(showToast._t); showToast._t=setTimeout(()=>_toast.classList.remove('is-show'),2400);
    }
    function syncGenSwitch(){
      const sw=document.getElementById('gsGenSwitch'); if(!sw) return;
      sw.querySelectorAll('button').forEach(b=>b.classList.toggle('is-active',+b.dataset.gen===currentGen));
    }
    function stopPlay(){ if(playTimer){ clearTimeout(playTimer); playTimer=null; }
      const play=document.getElementById('gsPlay'); if(play) play.innerHTML='<i class="ti ti-player-play"></i> 전선 남하 재생 (70→20)'; }

    let popAudioCtx=null;
    function popBeep(freq, btn){
      try{
        if(!popAudioCtx) popAudioCtx=new (window.AudioContext||window.webkitAudioContext)();
        const ctx=popAudioCtx;
        const osc=ctx.createOscillator(), gain=ctx.createGain();
        osc.type='sine'; osc.frequency.value=freq;
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime+0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.5);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime+0.5);
        if(btn){ btn.classList.add('is-playing'); setTimeout(()=>btn.classList.remove('is-playing'), 550); }
      }catch(e){}
    }

    function showPopover(w, code, evt){
      const pop=document.getElementById('gsMapPop'); if(!pop) return;
      const panel=document.querySelector('#jiyeoeo-gisangdo-root .gs-mappanel');
      const rect=panel.getBoundingClientRect();
      const word = (w.dialect || w.standard || '');
      const GEN_FREQ={70:300,50:400,20:520};
      const rows=[70,50,20].map(g=>{
        const rate=w.byRegion[g][code]; const wk=weatherOf(rate).key;
        return `<tr class="${g===currentGen?'is-current':''}">
          <td>${g}대</td>
          <td><span class="gs-popweather" style="color:${HEXVAR[wk]}"><i class="ti ${WEATHERS[wk].icon}"></i> ${WEATHERS[wk].label}</span></td>
          <td style="color:${HEXVAR[wk]};font-weight:800">${pct(rate)}%</td>
          <td><button type="button" class="gs-popspeaker" data-freq="${GEN_FREQ[g]}" aria-label="${g}대 음성 듣기"><i class="ti ti-volume"></i></button></td>
        </tr>`;
      }).join('');
      pop.innerHTML=`
        <div class="gs-pophead">
          <div class="gs-pophead__title">
            <span class="gs-pophead__region">${REGION_NAMES[code]}</span>
            <span>세대별 기상도</span>
          </div>
          <button type="button" class="gs-popclose" id="gsPopClose" aria-label="닫기"><i class="ti ti-x"></i></button>
        </div>
        <div class="gs-popbody">
          <div class="gs-popbody__title"><span>${word}</span> · 세대별 사용 현황</div>
          <table class="gs-poptable">
            <thead><tr><th>세대</th><th>날씨</th><th>사용률</th><th>듣기</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
      pop.classList.remove('gs-pop--below');
      pop.classList.add('is-open');
      const closer=document.getElementById('gsPopClose');
      if(closer) closer.onclick=(e)=>{ e.stopPropagation(); hidePopover(); };
      pop.querySelectorAll('.gs-popspeaker').forEach(btn=>{
        btn.onclick=(e)=>{ e.stopPropagation(); popBeep(+btn.dataset.freq, btn); };
      });

      // 말풍선을 클릭 지점 위에 가로 중앙 정렬, 공간이 없으면 아래로 뒤집음
      const pw=pop.offsetWidth, ph=pop.offsetHeight;
      let x=evt.pixel[0];
      x=Math.max(pw/2+6, Math.min(x, rect.width-pw/2-6));
      let y=evt.pixel[1]-ph-14;
      if(y<6){ pop.classList.add('gs-pop--below'); y=evt.pixel[1]+14; }
      pop.style.left=x+'px'; pop.style.top=y+'px';
    }
    function hidePopover(){ const p=document.getElementById('gsMapPop'); if(p) p.classList.remove('is-open'); }

    /* ── 라우팅 §3 (해시) ─────────────────────────────────────── */
    function route(){
      stopPlay();
      const h=(location.hash||'#/home').replace(/^#/,'');
      if(h.startsWith('/word/')){ renderWord(h.split('/')[2]); }
      else if(h.startsWith('/alert')){ renderAlert(); }
      else { renderHome(); }
      window.scrollTo({top:0, behavior:'instant' in window ? 'instant':'auto'});
    }
    function nav(to, id){
      if(to==='home') location.hash='#/home';
      else if(to==='alert') location.hash='#/alert';
      else if(to==='word') location.hash='#/word/'+id;
    }
    function wireNav(root){
      root.querySelectorAll('[data-nav]').forEach(el=>{
        el.addEventListener('click',()=>nav(el.dataset.nav, el.dataset.id));
        el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); nav(el.dataset.nav, el.dataset.id); }});
      });
    }
    function wireModeToggle(root, rerender){
      const tg=root.querySelector('#gsModeToggle'); if(!tg) return;
      tg.querySelectorAll('button').forEach(b=> b.addEventListener('click',()=>{
        if(getMode()===b.dataset.mode) return;
        setMode(b.dataset.mode); (rerender||(()=>renderWord(currentWordId)))();
      }));
    }

    /* ── 단어 선택 패널 (WordSearch §6.1) — our_town .map-pick 방식 ── */
    const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
    const CHO14=['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ']; // 표준 초성 버튼(된소리는 기본자음으로 접음)
    const CHO_FOLD={'ㄲ':'ㄱ','ㄸ':'ㄷ','ㅃ':'ㅂ','ㅆ':'ㅅ','ㅉ':'ㅈ'};
    function choseong(s){ const c=(s||'').charCodeAt(0)-0xAC00; const ch=(c<0||c>11171)?(s[0]||''):CHO[Math.floor(c/588)]; return CHO_FOLD[ch]||ch; }
    let pickInitial='ㄱ', pickQuery='', pickCollapsed=false;

    function filterWords(){
      const q=pickQuery.trim();
      return WORDS.filter(w=>{
        if(pickInitial!=='전체' && choseong(w.standard)!==pickInitial) return false;
        if(q && !(w.dialect.includes(q)||w.standard.includes(q)||w.forms.some(f=>f.surface.includes(q)))) return false;
        return true;
      });
    }
    function gridHTML(list){
      if(!list.length) return `<div class="gs-wgrid-empty">검색 결과가 없습니다</div>`;
      return list.map(w=>{
        return `<button type="button" class="gs-wbtn ${w.itemId===currentWordId?'is-active':''}" data-id="${w.itemId}" role="option" aria-selected="${w.itemId===currentWordId}">${w.standard}</button>`;
      }).join('');
    }
    function pickPanelHTML(){
      const inits=['전체'].concat(CHO14);
      const initHTML=inits.map(c=>`<button type="button" class="gs-initial ${c===pickInitial?'is-active':''}" data-ini="${c}">${c}</button>`).join('');
      return `
      <div class="gs-pick ${pickCollapsed?'is-collapsed':''}" id="gsPick">
        <div class="gs-pick__head">
          <p class="gs-pick__label"><i class="ti ti-vocabulary" aria-hidden="true"></i> 기상도를 볼 단어
            <span class="gs-pick__count">${WORDS.length}개</span></p>
          <button type="button" class="gs-pick__toggle" id="gsPickToggle" aria-expanded="${!pickCollapsed}">
            <span id="gsPickToggleLabel">${pickCollapsed?'목록 펼치기':'목록 접기'}</span>
            <i class="ti ti-chevron-down gs-pick__chev" aria-hidden="true"></i>
          </button>
        </div>
        <div class="gs-searchrow">
          <div class="gs-wordsearch ${pickQuery?'has-value':''}" id="gsWSWrap">
            <i class="ti ti-search gs-wordsearch__ico" aria-hidden="true"></i>
            <input type="search" class="gs-wordsearch__input" id="gsWS" placeholder="방언형·표준어형 검색 (예: 나락, 벼)" autocomplete="off" aria-label="단어 검색" value="${pickQuery.replace(/"/g,'&quot;')}">
            <button type="button" class="gs-wordsearch__clear" id="gsWSClear" aria-label="검색어 지우기"><i class="ti ti-x" aria-hidden="true"></i></button>
          </div>
          <button type="button" class="gs-searchbtn" id="gsSearchBtn"><i class="ti ti-search" aria-hidden="true"></i> 검색</button>
        </div>
        <div class="gs-pick__body">
          <div class="gs-initials" id="gsInitials" role="tablist" aria-label="초성 필터">${initHTML}</div>
          <div class="gs-wordgrid" id="gsWordGrid" role="listbox" aria-label="단어 목록">${gridHTML(filterWords())}</div>
        </div>
      </div>`;
    }
    function regrid(){
      const g=document.getElementById('gsWordGrid'); if(g) g.innerHTML=gridHTML(filterWords());
    }
    function wirePickPanel(root){
      const pick=root.querySelector('#gsPick');
      const toggle=root.querySelector('#gsPickToggle');
      if(toggle) toggle.addEventListener('click',()=>{
        pickCollapsed=!pickCollapsed;
        pick.classList.toggle('is-collapsed',pickCollapsed);
        toggle.setAttribute('aria-expanded', String(!pickCollapsed));
        root.querySelector('#gsPickToggleLabel').textContent = pickCollapsed?'목록 펼치기':'목록 접기';
      });
      const expand=()=>{ if(!pickCollapsed) return; pickCollapsed=false; pick.classList.remove('is-collapsed');
        if(toggle) toggle.setAttribute('aria-expanded','true');
        const lbl=root.querySelector('#gsPickToggleLabel'); if(lbl) lbl.textContent='목록 접기'; };
      const ws=root.querySelector('#gsWS'), wsWrap=root.querySelector('#gsWSWrap'), wsClear=root.querySelector('#gsWSClear');
      const doSearch=()=>{ pickQuery=ws?ws.value:''; if(wsWrap) wsWrap.classList.toggle('has-value',!!pickQuery); expand(); regrid(); };
      if(ws){
        ws.addEventListener('input',()=>{ pickQuery=ws.value; wsWrap.classList.toggle('has-value',!!pickQuery); regrid(); });
        ws.addEventListener('keydown',e=>{
          if(e.key==='Enter'){ e.preventDefault(); doSearch(); }
          else if(e.key==='Escape'){ ws.value=''; pickQuery=''; wsWrap.classList.remove('has-value'); regrid(); }
        });
      }
      const searchBtn=root.querySelector('#gsSearchBtn');
      if(searchBtn) searchBtn.addEventListener('click', doSearch);
      if(wsClear) wsClear.addEventListener('click',()=>{ pickQuery=''; ws.value=''; wsWrap.classList.remove('has-value'); regrid(); ws.focus(); });
      const inits=root.querySelector('#gsInitials');
      if(inits) inits.addEventListener('click',e=>{
        const b=e.target.closest('.gs-initial'); if(!b) return;
        pickInitial=b.dataset.ini;
        inits.querySelectorAll('.gs-initial').forEach(x=>x.classList.toggle('is-active',x===b));
        regrid();
      });
      const grid=root.querySelector('#gsWordGrid');
      if(grid) grid.addEventListener('click',e=>{
        const b=e.target.closest('.gs-wbtn'); if(!b) return;
        currentWordId=b.dataset.id;
        grid.querySelectorAll('.gs-wbtn').forEach(x=>{ const on=x===b; x.classList.toggle('is-active',on); x.setAttribute('aria-selected',String(on)); });
        renderHomeDetail();
        document.getElementById('gsHomeDetail').scrollIntoView({behavior:'smooth',block:'start'});
      });
    }

    /* ── 초기화 ───────────────────────────────────────────────── */
    function boot(){
      // 딥링크로 모드 지정 가능 (?mode=expert) — 이후 세션 유지 §3
      const qmode=new URLSearchParams(location.search).get('mode');
      if(qmode==='expert'||qmode==='general') setMode(qmode);
      // 지도 도구 팝오버: 바깥 클릭 시 닫기 & 범례 아코디언 토글
      document.addEventListener('click', e=>{
        document.querySelectorAll('#jiyeoeo-gisangdo-root .gs-popmenu').forEach(p=>p.hidden=true);
        const toggle = e.target.closest('.gs-map-legend-acc__toggle');
        if(toggle){
          const acc = toggle.closest('.gs-map-legend-acc');
          if(acc){
            const collapsed = acc.classList.toggle('is-collapsed');
            toggle.setAttribute('aria-expanded', String(!collapsed));
          }
        }
      });
      window.addEventListener('hashchange', route);
      route();
    }
    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  })();
  </script>
</body>
