<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- GNB 정렬 기준선인 1440px 가로폭 고정 뷰포트 (공통 규격) -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지역어 기상도 — 국립국어원</title>

<link rel="shortcut icon" href="./favicon.ico">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">

<!-- 공통 스타일시트 (전역 타이포/색 상속) -->
<link rel="stylesheet" href="./styles.css">

<!-- 공통 지도(OpenLayers) — 사양서 7장 MapAdapter가 재사용하는 공통 지도 컴포넌트 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.9.0/ol.css">

<!-- 공통 GNB / Footer / 공유도구 로더 -->
<script src="./gnb.js" defer></script>
<script src="./footer.js" defer></script>
<script src="./share.js" defer></script>

<!--
  ============================================================================
  지역어 기상도 — 모듈 전용 스타일 (사양서 §2.2 CSS 격리)
  · 전역 리셋(* / body / a) 금지, 모든 규칙을 #jiyeoeo-gisangdo-root 하위로 스코프
  · 클래스 프리픽스 gs- 사용, 기존 사이트 타이포·기본색은 상속
  · 모듈 고유 토큰: 상태 색 4종 + 지역어형없음 + 관측없음
  ============================================================================
-->
<style>
/* 다른 메뉴(예: dialect_our_town.html)와 동일하게 본문 배경을 화이트로 통일 */
body{ background:#ffffff; }

#jiyeoeo-gisangdo-root{
  /* 상태 색 (라이트) — 지역 평균 점수 구간을 나타내는 모듈 고유 토큰 */
  --gs-w1:#BA7517;  --gs-w1-bg:#FBF3E4;   /* 맑음   · 사용   */
  --gs-w2:#5F5E5A;  --gs-w2-bg:#F0F0EE;   /* 구름조금 · 이해   */
  --gs-w3:#185FA5;  --gs-w3-bg:#E7F0FA;   /* 흐리고 비 · 인지 */
  --gs-w4:#A32D2D;  --gs-w4-bg:#FAE8E8;   /* 천둥번개 · 무지  */
  --gs-w0:#94a3b8;  --gs-w0-bg:#f1f5f9;   /* 안개(관측결측)   */
  --gs-std:#2F5D8C; --gs-std-bg:#E8F0FA;   /* 표준어권 · 지역어형 없음 */

  /* 등급 색 (§6.3) */
  --gs-lv-crisis:#A32D2D; --gs-lv-warn:#993C1D; --gs-lv-watch:#854F0B; --gs-lv-calm:#64748b;

  /* 기존 사이트 표면색 계열 (상속 기반, 카드 문법 §4.2) */
  --gs-surface:#ffffff; --gs-surface-2:#f8fafc; --gs-line:#e2e8f0;
  --gs-text:#111827; --gs-muted:#64748b; --gs-radius:12px;

  /* 공통 .wrap과 동일하게 좌우 1440px 정렬 (헤더·로케이션과 좌우 끝선 일치) */
  max-width:1440px; margin:0 auto; padding:8px 20px 80px;
  color:var(--gs-text);
}
/* ── 단어 고르기 ─────────────────────────────────────────── */
#jiyeoeo-gisangdo-root .gs-pick{
  background:var(--gs-surface); border:1px solid var(--gs-line); border-radius:16px;
  padding:18px 22px 20px; margin-bottom:26px;
}
#jiyeoeo-gisangdo-root .gs-pick__head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
#jiyeoeo-gisangdo-root .gs-pick__label{ font-size:16px; font-weight:800; color:#0f172a; letter-spacing:-.02em; display:inline-flex; align-items:center; gap:7px; margin:0; }
#jiyeoeo-gisangdo-root .gs-pick__label i{ color:#2563eb; }
#jiyeoeo-gisangdo-root .gs-pick__count{ font-size:12px; font-weight:700; color:#1d4ed8; background:#eff6ff; border:1px solid #bfdbfe; padding:3px 10px; border-radius:99px; }
#jiyeoeo-gisangdo-root .gs-pick__toggle{ display:inline-flex; align-items:center; gap:4px; border:1px solid var(--gs-line); background:#fff; border-radius:10px; padding:6px 12px; cursor:pointer; font-family:inherit; font-size:12px; font-weight:700; color:#64748b; transition:.15s; }
#jiyeoeo-gisangdo-root .gs-pick__toggle:hover{ border-color:#93c5fd; color:#2563eb; background:#f8fbff; }
#jiyeoeo-gisangdo-root .gs-pick__chev{ font-size:14px; color:#94a3b8; transition:transform .2s; }
#jiyeoeo-gisangdo-root .gs-pick.is-collapsed .gs-pick__chev{ transform:rotate(180deg); }
#jiyeoeo-gisangdo-root .gs-pick.is-collapsed .gs-pick__body{ display:none; }

#jiyeoeo-gisangdo-root .gs-searchrow{ display:flex; margin-bottom:14px; max-width:640px; }
#jiyeoeo-gisangdo-root .gs-searchrow .gs-wordsearch__input{ border-radius:11px 0 0 11px; border-right:0; height:42px; }
#jiyeoeo-gisangdo-root .gs-searchrow .gs-searchbtn{ border-radius:0 11px 11px 0; height:42px; }
#jiyeoeo-gisangdo-root .gs-searchbtn{ flex:0 0 auto; display:inline-flex; align-items:center; gap:6px; height:40px; padding:0 18px; border:1px solid var(--blue); background:var(--blue); color:#fff; border-radius:11px; font-family:inherit; font-size:14px; font-weight:700; cursor:pointer; transition:.15s; }
#jiyeoeo-gisangdo-root .gs-searchbtn:hover{ background:#1d4ed8; border-color:#1d4ed8; }
#jiyeoeo-gisangdo-root .gs-searchbtn i{ font-size:16px; }
#jiyeoeo-gisangdo-root .gs-wordsearch{ position:relative; flex:1; }
#jiyeoeo-gisangdo-root .gs-wordsearch__input{ width:100%; height:40px; padding:0 36px; border:1px solid var(--gs-line); border-radius:11px; background:#fff; font-size:13px; font-weight:600; color:#0f172a; font-family:inherit; outline:none; transition:.15s; box-sizing:border-box; }
#jiyeoeo-gisangdo-root .gs-wordsearch__input::placeholder{ color:#94a3b8; font-weight:500; }
#jiyeoeo-gisangdo-root .gs-wordsearch__input:focus{ border-color:#93c5fd; box-shadow:0 0 0 3px rgba(37,99,235,.12); }
#jiyeoeo-gisangdo-root .gs-wordsearch__ico{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:#94a3b8; font-size:16px; pointer-events:none; }
#jiyeoeo-gisangdo-root .gs-wordsearch__clear{ position:absolute; right:8px; top:50%; transform:translateY(-50%); width:26px; height:26px; border:none; border-radius:8px; background:transparent; color:#94a3b8; cursor:pointer; display:none; place-items:center; font-size:15px; font-family:inherit; }
#jiyeoeo-gisangdo-root .gs-wordsearch.has-value .gs-wordsearch__clear{ display:grid; }
#jiyeoeo-gisangdo-root .gs-wordsearch__clear:hover{ background:#f1f5f9; color:#475569; }

#jiyeoeo-gisangdo-root .gs-initials{ display:flex; flex-wrap:wrap; gap:4px; margin:0 0 14px; padding-bottom:14px; border-bottom:1px solid #f1f5f9; }
#jiyeoeo-gisangdo-root .gs-initial{ min-width:36px; height:34px; padding:0 9px; border:1px solid var(--gs-line); background:#fff; border-radius:9px; font-size:13px; font-weight:700; color:#475569; cursor:pointer; font-family:inherit; transition:.12s; }
#jiyeoeo-gisangdo-root .gs-initial:hover{ border-color:#93c5fd; color:#2563eb; }
#jiyeoeo-gisangdo-root .gs-initial.is-active{ background:#2563eb; border-color:#2563eb; color:#fff; box-shadow:0 2px 8px rgba(37,99,235,.28); }

#jiyeoeo-gisangdo-root .gs-wordgrid{ display:flex; flex-wrap:wrap; gap:6px; max-height:216px; overflow-y:auto; padding-right:2px; scrollbar-width:thin; scrollbar-color:#cbd5e1 transparent; }
#jiyeoeo-gisangdo-root .gs-wbtn{ appearance:none; flex:0 0 auto; white-space:nowrap; min-width:74px; height:36px; justify-content:center; border:1px solid var(--gs-line); background:#fff; border-radius:9px; padding:0 14px; font-size:13.5px; font-weight:700; color:#334155; cursor:pointer; font-family:inherit; transition:.12s; display:inline-flex; align-items:center; gap:7px; }
#jiyeoeo-gisangdo-root .gs-wbtn small{ color:#94a3b8; font-weight:600; font-size:11px; margin-left:auto; }
#jiyeoeo-gisangdo-root .gs-wbtn:hover{ border-color:#93c5fd; background:#eff6ff; color:#1d4ed8; }
#jiyeoeo-gisangdo-root .gs-wbtn.is-all{ border-color:#c7d2fe; background:#eef2ff; color:#3730a3; }
#jiyeoeo-gisangdo-root .gs-wbtn.is-all:hover{ border-color:#818cf8; background:#e0e7ff; }
#jiyeoeo-gisangdo-root .gs-wbtn.is-active{ border-color:#2563eb; background:#2563eb; color:#fff; box-shadow:0 2px 8px rgba(37,99,235,.3); }
#jiyeoeo-gisangdo-root .gs-wbtn.is-active small{ color:rgba(255,255,255,.78); }
#jiyeoeo-gisangdo-root .gs-wgrid-empty{ grid-column:1/-1; text-align:center; padding:18px 8px; font-size:13px; font-weight:600; color:#94a3b8; }

/* 카드 문법 §4.2 */
#jiyeoeo-gisangdo-root .gs-card{
  background:var(--gs-surface); border:1px solid var(--gs-line); border-radius:var(--gs-radius);
  padding:16px 18px;
}
#jiyeoeo-gisangdo-root .gs-card__label{ font-size:11px; letter-spacing:.02em; color:var(--gs-muted); font-weight:600; }

/* 날씨 아이콘 (WeatherIcon) */
#jiyeoeo-gisangdo-root .gs-wi{ display:inline-flex; align-items:center; justify-content:center; }

/* 선택 단어 타이틀 */

/* 기상도 지도 (RegionWeatherMap) */
/* 지도 상단 도구모음 (dialect_map.html .mapbar 계승) */
#jiyeoeo-gisangdo-root .gs-mapbar{ display:flex; align-items:center; justify-content:space-between; gap:16px; background:var(--gs-surface); border:1px solid var(--gs-line); border-radius:16px; padding:16px 22px; box-shadow:var(--shadow2); flex-wrap:wrap; margin:0 0 14px; }
#jiyeoeo-gisangdo-root .gs-mapbar__title{ font-size:19px; font-weight:800; color:var(--gs-text); letter-spacing:-.02em; }
#jiyeoeo-gisangdo-root .gs-mapbar__title b{ color:var(--blue); }
#jiyeoeo-gisangdo-root .gs-mapbar__actions{ display:flex; align-items:center; gap:8px; }
#jiyeoeo-gisangdo-root .gs-toolbtn{ display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:#475569; background:#fff; border:1px solid var(--gs-line); border-radius:10px; padding:9px 14px; cursor:pointer; font-family:inherit; transition:.15s; }
#jiyeoeo-gisangdo-root .gs-toolbtn:hover{ border-color:var(--blue); color:var(--blue); background:var(--blue-light); }
#jiyeoeo-gisangdo-root .gs-toolbtn i{ font-size:16px; }
#jiyeoeo-gisangdo-root .gs-toolbtn--primary{ background:var(--blue); border-color:var(--blue); color:#fff; }
#jiyeoeo-gisangdo-root .gs-toolbtn--primary:hover{ background:#1d4ed8; color:#fff; }
#jiyeoeo-gisangdo-root .gs-popwrap{ position:relative; }
#jiyeoeo-gisangdo-root .gs-popmenu{ position:absolute; top:calc(100% + 8px); right:0; z-index:50; background:#fff; border:1px solid #cbd5e1; border-radius:14px; box-shadow:0 10px 30px rgba(15,23,42,.14); padding:14px; min-width:240px; }
#jiyeoeo-gisangdo-root .gs-popmenu[hidden]{ display:none; }
#jiyeoeo-gisangdo-root .gs-popmenu__sec{ padding:10px 0; border-top:1px solid #f1f5f9; }
#jiyeoeo-gisangdo-root .gs-popmenu__sec:first-child{ border-top:none; padding-top:0; }
#jiyeoeo-gisangdo-root .gs-popmenu__label{ font-size:12px; font-weight:800; color:#94a3b8; margin-bottom:10px; letter-spacing:.02em; }
#jiyeoeo-gisangdo-root .gs-mschk{ display:flex; align-items:center; gap:6px; margin-bottom:8px; font-size:13px; font-weight:600; color:#475569; cursor:pointer; }
#jiyeoeo-gisangdo-root .gs-mschk:last-child{ margin-bottom:0; }
#jiyeoeo-gisangdo-root .gs-mschk input{ width:16px; height:16px; accent-color:var(--blue); cursor:pointer; }
#jiyeoeo-gisangdo-root .gs-ovdot{ display:inline-block; width:11px; height:11px; border-radius:3px; }
#jiyeoeo-gisangdo-root .gs-dlmenu__item{ display:flex; align-items:center; gap:10px; width:100%; background:none; border:none; border-radius:10px; padding:10px 12px; font-size:14px; font-weight:700; color:#334155; cursor:pointer; font-family:inherit; text-align:left; transition:.15s; }
#jiyeoeo-gisangdo-root .gs-dlmenu__item:hover{ background:var(--blue-light); color:var(--blue); }
#jiyeoeo-gisangdo-root .gs-dlmenu__item i{ font-size:18px; color:#64748b; }
#jiyeoeo-gisangdo-root .gs-dlmenu__item:hover i{ color:var(--blue); }
#jiyeoeo-gisangdo-root .gs-dlmenu__note{ display:flex; gap:6px; align-items:flex-start; margin-top:8px; padding:10px 12px; background:var(--gs-surface-2); border-radius:10px; font-size:12px; color:#64748b; line-height:1.5; }
#jiyeoeo-gisangdo-root .gs-dlmenu__note i{ flex-shrink:0; margin-top:1px; }
#jiyeoeo-gisangdo-root .gs-toast{ position:fixed; left:50%; bottom:32px; transform:translateX(-50%) translateY(10px); background:#0f172a; color:#fff; font-size:13px; font-weight:600; padding:12px 18px; border-radius:10px; box-shadow:0 10px 30px rgba(15,23,42,.24); display:flex; align-items:center; gap:8px; opacity:0; pointer-events:none; transition:.2s; z-index:9999; }
#jiyeoeo-gisangdo-root .gs-toast.is-show{ opacity:1; transform:translateX(-50%) translateY(0); }
#jiyeoeo-gisangdo-root .gs-mapwrap{ display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:18px; align-items:stretch; }
#jiyeoeo-gisangdo-root .gs-mappanel{ position:relative; padding:0; overflow:hidden; }
#jiyeoeo-gisangdo-root #gs-map{ width:100%; aspect-ratio:1.18/1; height:auto; min-height:480px; background:var(--gs-surface-2); }
#jiyeoeo-gisangdo-root .gs-mapreset{ position:absolute; top:12px; right:12px; z-index:6; width:38px; height:38px; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--gs-line); background:rgba(255,255,255,.94); border-radius:9px; color:#475569; cursor:pointer; box-shadow:0 2px 8px rgba(15,23,42,.1); transition:.15s; }
#jiyeoeo-gisangdo-root .gs-mapreset:hover{ border-color:var(--blue); color:var(--blue); }
#jiyeoeo-gisangdo-root .gs-mapreset i{ font-size:18px; }
#jiyeoeo-gisangdo-root .gs-map-fallback{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; text-align:center; color:var(--gs-muted); font-size:13px; padding:24px; }
/* 우측 칸은 지도 높이에 맞춘다.
   안쪽을 absolute 로 띄워 내용이 행 높이를 밀어올리지 못하게 하는 게 요점이다.
   그렇게 해야 행 높이가 지도(aspect-ratio)로 정해지고, 넘치는 목록은 안에서 스크롤된다. */
#jiyeoeo-gisangdo-root .gs-mapside{ position:relative; min-height:480px; }
#jiyeoeo-gisangdo-root .gs-mapside__in{ position:absolute; inset:0;
  display:flex; flex-direction:column; gap:12px; }
@media (max-width:768px){
  #jiyeoeo-gisangdo-root .gs-mapside{ min-height:0; }
  #jiyeoeo-gisangdo-root .gs-mapside__in{ position:static; }
  #jiyeoeo-gisangdo-root .gs-rlist__body{ max-height:420px; }
}
/* 세대 예보 세로 행 (지도 우측) — 지도 세대 전환 겸용 */
#jiyeoeo-gisangdo-root .gs-genrows{ display:flex; flex-direction:column; gap:6px; }
#jiyeoeo-gisangdo-root .gs-genrow{ display:flex; align-items:center; gap:10px; width:100%; border:1px solid var(--gs-line); background:#fff; border-radius:10px; padding:8px 10px; cursor:pointer; font-family:inherit; transition:.12s; }
#jiyeoeo-gisangdo-root .gs-genrow:hover{ border-color:#93c5fd; background:#f8fbff; }
#jiyeoeo-gisangdo-root .gs-genrow.is-active{ border-color:#0f172a; background:#0f172a; }
#jiyeoeo-gisangdo-root .gs-genrow .gr-emoji{ font-size:20px; line-height:1; }
#jiyeoeo-gisangdo-root .gs-genrow .gr-gen{ font-size:13px; font-weight:800; color:var(--gs-text); min-width:34px; text-align:left; }
#jiyeoeo-gisangdo-root .gs-genrow.is-active .gr-gen{ color:#fff; }
#jiyeoeo-gisangdo-root .gs-genrow .gr-bar{ flex:1; height:6px; border-radius:4px; background:var(--gs-surface-2); overflow:hidden; }
#jiyeoeo-gisangdo-root .gs-genrow.is-active .gr-bar{ background:rgba(255,255,255,.25); }
#jiyeoeo-gisangdo-root .gs-genrow .gr-bar>span{ display:block; height:100%; border-radius:4px; }
#jiyeoeo-gisangdo-root .gs-genrow .gr-rate{ font-size:14px; font-weight:800; min-width:40px; text-align:right; }
#jiyeoeo-gisangdo-root .gs-genrow.is-active .gr-rate{ color:#fff !important; }

/* 지도 우측 하단 아코디언 범례 */
#jiyeoeo-gisangdo-root .gs-map-legend-acc{
  position:absolute; bottom:12px; right:12px; z-index:6;
  background:rgba(255,255,255,.94); backdrop-filter:blur(4px);
  border:1px solid var(--gs-line); border-radius:12px;
  box-shadow:0 4px 14px rgba(15,23,42,.12); overflow:hidden;
  transition:all .2s ease; width:236px;
}
#jiyeoeo-gisangdo-root .gs-map-legend-acc__toggle{
  display:flex; align-items:center; justify-content:space-between; gap:6px;
  width:100%; padding:8px 11px; background:transparent; border:none;
  font-family:inherit; font-size:12px; font-weight:800; color:#1e293b;
  cursor:pointer; text-align:left;
}
#jiyeoeo-gisangdo-root .gs-map-legend-acc__toggle:hover{ background:rgba(241,245,249,.8); }
#jiyeoeo-gisangdo-root .gs-map-legend-acc__toggle .chev{ font-size:14px; color:#64748b; transition:transform .2s; }
#jiyeoeo-gisangdo-root .gs-map-legend-acc.is-collapsed .gs-map-legend-acc__toggle .chev{ transform:rotate(180deg); }
#jiyeoeo-gisangdo-root .gs-map-legend-acc.is-collapsed .gs-map-legend-acc__body{ display:none; }
#jiyeoeo-gisangdo-root .gs-map-legend-acc__body{ padding:4px 11px 8px; border-top:1px solid #f1f5f9; }
#jiyeoeo-gisangdo-root .gs-map-legend-acc__body .row{ display:grid; grid-template-columns:11px 1fr; align-items:start; column-gap:7px; font-size:11.5px; padding:3px 0; color:#334155; line-height:1.45; }
#jiyeoeo-gisangdo-root .gs-map-legend-acc__body .sw{ width:11px; height:11px; border-radius:3px; flex-shrink:0; margin-top:3px; }
#jiyeoeo-gisangdo-root .gs-map-legend-acc__body .row.is-muted{ color:#94a3b8; font-weight:500; }
/* 범례 — 뜻을 굵게, 숫자/날씨이름은 뒤로 물린다 */
#jiyeoeo-gisangdo-root .gs-map-legend-acc__body .row b{ font-weight:700; color:#1e293b; }
#jiyeoeo-gisangdo-root .gs-map-legend-acc__body .row em{ display:block; font-style:normal; color:#94a3b8; font-weight:500; font-size:10px; }
#jiyeoeo-gisangdo-root .gs-map-legend-acc__body .row.is-muted b{ color:#94a3b8; font-weight:600; }

/* 지도 아래 한 문장 설명 */

/* 지도 제목 아래 실제 방언형 줄 */
#jiyeoeo-gisangdo-root .gs-mapbar__sub{ margin-top:4px; font-size:13px; color:#475569; line-height:1.5; }
#jiyeoeo-gisangdo-root .gs-mapbar__desc{ margin-top:4px; font-size:12.5px; color:#64748b; line-height:1.55; }
#jiyeoeo-gisangdo-root .gs-mapbar__sub b{ color:#BA7517; font-weight:800; }
/* ── 상단 인트로 ── 왼쪽 그림 · 가운데 말 · 오른쪽 숫자 카드 4장.
   .gs-hero 는 기존 클래스와 충돌하므로 쓰지 않는다(과거 사고). gs-intro 로 통일. */
#jiyeoeo-gisangdo-root .gs-intro{
  display:grid; grid-template-columns:112px minmax(0,1fr) 392px; gap:26px; align-items:center;
  background:linear-gradient(135deg,#fbfcfe 0%,#f6f9fd 100%);
  border:1px solid #e8eef6; border-radius:18px; padding:26px 26px; margin-bottom:14px;
}
#jiyeoeo-gisangdo-root .gs-intro__art{ align-self:center; }

  <!--

  <script>
  (function(){
    'use strict';

    /* ── 상태 상수 ─────────────────────────────────────────────────
       조사표의 사용도/인지도 4등급을 점수로 환산해 지역 평균을 낸다.
         ① 사용 100 · ② 이해 75 · ③ 인지 50 · ④ 무지 25
       상태 경계는 등급 사이의 중간값(87.5 / 62.5 / 37.5)이다 —
       별도로 정한 임계값이 아니라 등급 척도에서 그대로 나온다.
       설명 문구는 '지역 평균'을 말한다. 개인 등급 문구(사용/이해/인지/무지)는
       제보자 한 명을 가리키는 말이므로 지역 색에 붙이지 않는다. */
    const GRADE_SCORE = {1:100, 2:75, 3:50, 4:25};
    const WEATHERS = {
      w1:{ key:'w1', label:'맑음',      icon:'ti-sun',         desc:'평균 87.5점 이상 — 대체로 지금도 씀' },
      w2:{ key:'w2', label:'구름조금',  icon:'ti-cloud',       desc:'평균 62.5~87.4점 — 쓰거나 써 본 사람이 많음' },
      w3:{ key:'w3', label:'흐리고 비', icon:'ti-cloud-rain',  desc:'평균 37.5~62.4점 — 들어는 본 정도가 많음' },
      w4:{ key:'w4', label:'천둥번개',  icon:'ti-cloud-bolt',  desc:'평균 37.5점 미만 — 대체로 처음 들음' },
      w0:{ key:'w0', label:'관측 없음', icon:'ti-cloud-off',   desc:'등급이 적히지 않아 판단할 수 없음' },
      // 제5상태 — 조사는 됐으나 지역어형이 나오지 않은 지역. 결측이 아니라 조사 결과다.
      std:{ key:'std', label:'지역어형 없음', icon:'ti-circle-check', desc:'조사됐으나 지역어형이 나오지 않음' }
    };
    // 개인 등급 문구 — 조사표 정의 그대로. 제보자 한 명을 설명할 때만 쓴다.
    const GRADE_DESC = {
      1:'현재 일상생활에서도 쓰고 있다',
      2:'써본 적은 있지만 현재 일상생활에서는 쓰지 않는다',
      3:'써본 적은 없지만 들어본 적은 있다',
      4:'써본 적도 없고 처음 들어보는 말이다'

    /* 점수 → 상태. scripts/etl_awareness_region.py weather_of() 와 같아야 한다. */
    function weatherOf(score){
      if(score==null||isNaN(score)) return WEATHERS.w0;

    const CSSVAR = { w1:'var(--gs-w1)', w2:'var(--gs-w2)', w3:'var(--gs-w3)', w4:'var(--gs-w4)', w0:'var(--gs-w0)', std:'#5B7FA6' };
    const HEXVAR = { w1:'#BA7517', w2:'#5F5E5A', w3:'#185FA5', w4:'#A32D2D', w0:'#94a3b8', std:'#A8C4E5' };
    // 지도 위 날씨 이모지 — dialect_awareness.html과 동일한 아이콘 세트
    const EMOJI = { w1:'☀️', w2:'🌤️', w3:'🌧️', w4:'⛈️', w0:'', std:'' };
    const isPlain = k => !EMOJI[k];                       // 이모지 없이 텍스트로만 표기하는 상태
    const wLabel  = k => (EMOJI[k] ? EMOJI[k]+' ' : '') + WEATHERS[k].label;
    const pct = r => (r==null||isNaN(r)) ? '—' : Math.round(r*100);
    const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

    /* ── 지역 상수 §5.2 ────────────────────────────────────────── */
    const REGION_NAMES = {CB:'충북',CN:'충남',GB:'경북',GG:'경기',GN:'경남',GW:'강원',JB:'전북',JN:'전남',JJ:'제주'};
    // 행정구역 표준 순서: 경기 → 강원 → 충북 → 충남 → 전북 → 전남 → 경북 → 경남 → 제주
    const REGION_ORDER = ['GG','GW','CB','CN','JB','JN','GB','GN','JJ'];
    // 실제 조사 지점 · 제보자 구성 — awareness_by_region.json에서 채운다
    let SITE_NAMES = {}, ROSTER = {};
    // 명부에 그 조건의 제보자가 있나. 성별을 주면 (세대,성별)까지 본다 —
    // '조사 안 함(·)' 과 '조사했는데 지역어형 없음(–)' 을 가르는 기준이다.
    const hasInformant = (code,g,sex) => (ROSTER[code]||[])
      .some(x=>x.age===g && (!sex || x.sex===sex));
    const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));


    /* ── 방언형 계열 데이터 (실측 · 보고서 서술 기반) ─────────────────
       '벼'의 방언형은 벼계(벼·베, 중부)와 나락계(나락·나록, 남부)로 갈리며,
       세대가 내려갈수록 벼계가 전국으로 확산(전선 남하)한다. 지역은 도(道) 단위로 단순화. */

    /* ── 의미 범주 라벨 (항목번호 앞3자리 §5.6) ───────────────── */
    const CATEGORY = {'201':'신체','203':'동물·어류','204':'농사·작물','205':'자연·날씨','214':'생활','215':'도구','219':'채소','221':'가옥','222':'가옥','A':'생활·자세'};
    function catOf(id){ return CATEGORY[id.slice(0,3)] || CATEGORY[id[0]] || '기타'; }

    /* ── 데이터 §5, §5.6 ──────────────────────────────────────────
       서비스 대상 101개 표준어 항목. 실측/큐레이션 단어는 CURATED에 두고,
       나머지는 항목명 해시로 안정적인 시연용 사용률을 생성한다(원자료 확보 시 교체). */
    const WORDLIST = ['흰자위','눈두덩','귀청','귀지','귀이개','구레나룻','입술','휘파람','콧구멍','겨드랑','무릎','복사뼈','배꼽','딸꾹질','졸음','기지개','혓바늘','미꾸라지','벌레','구더기','매미','모기','벌','파리','쉬슬다','메뚜기','지렁이','회충','고양이','모이','노루','여우','갈치','강아지','뱀','누에','번데기','억새','벼','오디','바위','모래','가을','겨울','글피','그저께','그끄저께','우박','노을','언제','새벽','회오리바람','아우타다','계집아이','눕히다','할머니(호칭)','형(호칭)','사위(호칭)','호미','거지','서 되/세 되','꾸러미','짚신','가위','다리미','건더기','메밀','엿기름','고춧가루','달걀','간장','콩나물','시루','뚜껑','오이','무','부추','시래기','가(邊)','아궁이','구멍','그을음','마루','장독대','변소','벽','새끼(繩)','똬리','갈퀴','키(箕)','부지깽이','반짇고리','다듬잇돌','꽹과리','자치기','곤지곤지','그네','목말','소꿉놀이','쥐불놀이','다르다/틀리다'];

    // 목록 순서 기준 의미 범주 (구간 시작 인덱스)
    const CAT_RANGES = [[0,'신체·생리'],[17,'벌레·물고기'],[28,'동물'],[37,'식물·자연'],[42,'시간·날씨'],[52,'사람·호칭'],[58,'음식·도구'],[78,'가옥·공간'],[86,'생활·도구'],[96,'놀이']];
    function catByIndex(i){ let lab='기타'; for(const [s,l] of CAT_RANGES){ if(i>=s) lab=l; } return lab; }

    // 큐레이션(실측/보고서 기반) 단어 — 나머지는 자동 생성
    /* 데이터로 계산할 수 없는 것만 둔다 — 항목번호, 해설, 보고서에 실린 교차표.
       지역·세대 수치는 전부 awareness_by_region.json(실측)에서 온다. */
    const CURATED = {
      '벼':{ itemId:'20415',
        desc:'‘벼’의 방언형은 크게 ‘벼’계(벼, 베)와 ‘나락’(나락, 나록)계로 나뉨' },
      '아궁이':{ itemId:'22102' },
      '부추':{ itemId:'21908' },
      '미꾸라지':{ itemId:'20306' },
      '우박':{ itemId:'20509' },
      '가위':{ itemId:'21501' },
      '겨드랑':{ itemId:'20124' }
    };

    /* 단어 목록. 지역·세대 수치는 전부 awareness_by_region.json(실측)에서 온다.
       여기에는 식별자와 해설처럼 데이터로 계산할 수 없는 것만 둔다. */
    const RAW = WORDLIST.map((std,i)=>{
      const cur = CURATED[std] || {};
      const e = {
        itemId: cur.itemId || ('W'+String(i+1).padStart(3,'0')),
        standard: std,
        desc: cur.desc || null,
        category: catByIndex(i)
      };
      if(cur.ct){ e.ct = cur.ct; e.stats = cur.stats; }   // 보고서 교차표가 있는 항목만
      return e;
    });

    function buildWord(r){
      const w = Object.assign({}, r);
      w.category = r.category || catOf(r.itemId);
      return w;
    }

    /* ── 지역별 인지도 실측 데이터 ─────────────────────────────────────────
       1순위: /api/weather/awareness — 전용 테이블 wb_weather_* 에서 만든 결과.
              관리자에서 원자료를 올리면 곧바로 반영된다.
       2순위: ./data/processed/awareness_by_region.json — 정적 호스팅(GitHub Pages)용.
              서버가 없으면 API 가 404 이므로 파일로 되돌아간다.
       둘 다 실패하면 모든 지역이 '관측 없음'으로 표시된다(추정값으로 채우지 않는다).
       두 경로의 구조와 판정은 etl_awareness_region.build_output() 한 곳에서 나온다. */
    let AWARE_BY_WORD = {};
    let AWARE_ORIGIN = null;   // 'db' | 'file' | null
    function loadAware(){
      const apply = (j, origin)=>{
        AWARE_ORIGIN = origin;
        window.__AWARE_ORIGIN = origin;   // 진단용 — DB(db) / 정적파일(file) 어느 쪽을 썼는지
        SITE_NAMES = j.regionSites || {};
        ROSTER = j.regionRoster || {};
        // 전 항목 통합 — '전체' 라는 단어 하나로 취급하면 지도·세대·성별 경로가 그대로 돈다
        if(j.overall){
          AWARE_BY_WORD['전체'] = j.overall;
          if(!WORDS.some(x=>x.itemId==='__ALL__')){
            WORDS.unshift({ itemId:'__ALL__', standard:'전체', category:'전체', desc:null });
            BY_ID['__ALL__'] = WORDS[0];
          }
        }
        (j.items||[]).forEach(it=>{
          AWARE_BY_WORD[it.word]=it;
          // 실측 항목번호로도 딥링크가 되도록 BY_ID에 별칭을 건다 (#/word/20606 등)
          const w = WORDS.find(x=>x.standard===it.word);
          if(w && !BY_ID[it.code]) BY_ID[it.code]=w;
        });
      };
      const fromTurso = ()=> {
        const url = 'https://korean-weather-lulu-tt.aws-ap-northeast-1.turso.io/v2/pipeline';
        const token = 'eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJpYXQiOjE3ODgxNDA2MDUsImlkIjoiMDFhMDU1N2MtMzUwMS03ZWI1LTlkNTctZjI0NzJmZjQzOTRkIiwia2lkIjoiNm1PSEd1b2NjdG4tN2I5SHBDOTZnQW5XNVZuN29PZU10cnBHZWVUdEo3NCIsInJpZCI6Ijc0YzdjODIzLWI1MDQtNDRlMS1hZDNhLWUxZmIzODdiNWE2MSJ9.T_f31BvhLdd4CV8pb_UNmsP5YKo0jvKmYuMN6u1rE_oTmEcVzNWp1xt0BhLKZF9gj1rL0UaqVg9JXGbDEfABBw';
        const REGION_ORDER = ['GG', 'GW', 'CB', 'CN', 'JB', 'JN', 'GB', 'GN', 'JJ'];
        const REGION_NAMES = {'GG': '경기', 'GW': '강원', 'CB': '충북', 'CN': '충남', 'JB': '전북', 'JN': '전남', 'GB': '경북', 'GN': '경남', 'JJ': '제주'};
        const SITE_NAMES = {'GG': '경기 파주', 'GW': '강원 강릉', 'CB': '충북 청주', 'CN': '충남 부여', 'JB': '전북 전주', 'JN': '전남 나주', 'GB': '경북 안동', 'GN': '경남 창원', 'JJ': '제주 서귀포'};
        
        return fetch(url, {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            requests: [
              { type: 'execute', stmt: { sql: 'SELECT weather_file_id, region_cd FROM wb_weather_file' } },
              { type: 'execute', stmt: { sql: 'SELECT r.item_cd, r.headword, r.dialect_form, r.grade, f.region_cd FROM wb_weather_response r JOIN wb_weather_file f ON r.weather_file_id = f.weather_file_id' } }
            ]
          })
        })
        .then(r=> r.ok ? r.json() : Promise.reject(new Error(r.status)))
        .then(res=>{
          if(!res.results || !res.results[0].response || !res.results[1].response) throw new Error('Turso query error');
          const fileRows = res.results[0].response.result.rows;
          const respRows = res.results[1].response.result.rows;
          const itemsDict = {};
          
          respRows.forEach(r=>{
            const code = r[0].value, word = r[1].value, usage = r[3].value, rg = r[4].value;
            if(!code || !word) return;
            if(!itemsDict[code]) itemsDict[code] = { code: code, word: word, regions: {} };
            if(rg && REGION_ORDER.includes(rg)){
              if(!itemsDict[code].regions[rg]) itemsDict[code].regions[rg] = { rows: 0, graded: 0, people: 0, state: 'w1' };
              itemsDict[code].regions[rg].rows++;
              if(usage) itemsDict[code].regions[rg].graded++;
            }
          });
          
          const data = {
            status: 'success',
            regionOrder: REGION_ORDER,
            regionNames: REGION_NAMES,
            regionSites: SITE_NAMES,
            meta: { qc: { files: fileRows.length, rowsTotal: respRows.length, coreItems: Object.keys(itemsDict).length } },
            items: Object.values(itemsDict)
          };
          apply(data, 'db');
        });
      };

      const fromFile = ()=> fetch('./data/processed/awareness_by_region.json')
        .then(r=> r.ok ? r.json() : Promise.reject(new Error(r.status)))
        .then(j=> apply(j, 'file'));

      return fromTurso()
        .catch(()=> fetch('/api/weather/awareness').then(r=>r.json()).then(j=>apply(j,'db')))
        .catch(()=> fromFile())
        .catch(()=>{ AWARE_BY_WORD={}; AWARE_ORIGIN=null; });
    }
    function hasAware(w){ return !!AWARE_BY_WORD[w.standard]; }
    const isAll = w => !!w && w.itemId==='__ALL__';   // 전 항목 통합 보기인가
    /* gen: 0=전체(지역 평균 점수) · 20|50|70=그 세대 제보자의 사례 */
    function cellOf(w, gen, code){
      const it = AWARE_BY_WORD[w.standard];
      if(it){
        const rc = it.regions[code] || {};
        if(!gen){
          return { state: rc.state||'w0', n: rc.n||0,
                   score: (rc.score!=null && rc.n) ? rc.score : null,
                   forms: rc.forms||[], cases: rc.cases||[], note: rc.note||'',
                   heads: rc.heads||[], bases: rc.bases||[],  // 그 지역에서 조사된 말 (원문 그대로)
                   items: rc.items, answers: rc.answers };   // 통합 보기에서만 있다
        }
        // 성별을 고르면 (세대×성별) 칸, 아니면 세대 칸
        const g = currentSex
          ? (rc.gensex||{})[String(gen)+currentSex]
          : (rc.gens||{})[String(gen)];
        if(g) return { state:g.state, n:g.n||0, score:(g.score!=null?g.score:null),
                       forms:rc.forms||[], cases:g.cases||[], note:rc.note||'' };
        return { state: rc.state==='std' ? 'std' : 'w0', n:0, score:null, forms:[], cases:[], note:rc.note||'' };
      }
      return { state:'w0', n:0, score:null, forms:[], cases:[], note:'실측 자료를 불러오지 못했습니다' };
    }
    /* 지도 마커·표에 쓸 짧은 라벨 — 세대별은 점수가 아니라 제보자 수 */
    function cellLabel(c){                                 // 좁은 칸용 짧은 라벨
      if(c.score!=null) return Math.round(c.score)+'점';
      if(c.state==='std') return '없음';
      if(c.state==='w0')  return '—';
      return (c.n||0) + '명';
    }
    function cellText(c){                                  // 지도 마커용 풀어 쓴 말
      if(c.state==='std') return '지역어형 없음';
      if(c.state==='w0')  return '관측 없음';
      return cellLabel(c);
    }
    const SEXKO = {M:'남', F:'여'};
    /* 이 단어가 지역에서 실제로 불리는 말들 — 많이 나온 순 */
    /* 그 세대 제보자 중 지역어형을 '지금도 쓴다(1)'고 답한 사람 수 — 실측 */
    /* 전 지역 합계 — '전체' 줄이 세대 줄과 같은 표기(점수 · 명수)를 쓰게 한다.
       지역 칸의 dist(등급별 사람 수)를 모아 같은 식으로 평균한다. */
    function allTally(w){
      const it=AWARE_BY_WORD[w.standard];
      if(!it) return {n:0, used:0, score:null};
      let n=0, used=0, sum=0, ppl=0, agg=false;
      REGION_ORDER.forEach(rg=>{
        const c=it.regions[rg]||{}, d=c.dist||{};
        [1,2,3,4].forEach(k=>{ const q=d[String(k)]||0; n+=q; used+=(k===1?q:0); sum+=q*GRADE_SCORE[k]; });

        if(c.answers!=null) agg=true;   // 통합 — dist 의 단위가 '명' 이 아니라 '응답'
      });
      return {n, used, score: n?sum/n:null, agg, people: ppl};
    }
    function genTally(w, g, sex){
      const it=AWARE_BY_WORD[w.standard];
      if(!it) return {n:0, used:0, best:0};
      const sx = (sex===undefined) ? currentSex : sex;
      let n=0, used=0, best=4, ppl=0, agg=false, sum=0, cnt=0;
      REGION_ORDER.forEach(rg=>{
        const rc=it.regions[rg]||{};
        const gg = sx ? (rc.gensex||{})[String(g)+sx] : (rc.gens||{})[String(g)];
        if(!gg) return;
        if(gg.answers!=null){            // 통합(전체 101개) — 사례 대신 집계 수치를 쓴다

          if(gg.score!=null){ sum+=gg.score*gg.answers; cnt+=gg.answers; }
        } else if(gg.cases){
          gg.cases.forEach(c=>{ n++; if(c.grade===1) used++; best=Math.min(best,c.grade);
                                sum+=GRADE_SCORE[c.grade]||0; cnt++; });
          ppl+=gg.n||0;
        }
      });
      // 점수는 지도와 같은 식(등급 점수 평균). 예전에는 used/n(0~1 비율)을 weatherOf 에
      // 그대로 넣어 세대 줄 이모지가 늘 천둥번개였다.
      return {n, used, best: n?best:0, agg, people: ppl, score: cnt?sum/cnt:null};

    const CENTROID = {
      GG:[127.05,37.40], GW:[128.30,37.75], CB:[127.75,36.80], CN:[126.75,36.50],
      GB:[128.75,36.35], GN:[128.20,35.30], JB:[127.10,35.70], JN:[126.90,34.85], JJ:[126.55,33.40]

    // 실제 폴리곤 기하로부터 계산한 각 도의 내부 중심점(지도 투영 좌표) — 마커를 지역 중앙에 배치
    const AUTO_CENTROID = {};
    // 마커 미세 조정(투영 좌표 오프셋, px 아님) — 인접 도 라벨 겹침/치우침 보정

    const CENTROID_NUDGE = {

    function markerCoord(code){

    let olMap=null, playTimer=null;

    function createMapAdapter(targetEl){
      if(!window.ol || !window.KoreaMap || !window.KOREA_PROVINCES) return null;
      let fillLayer=null;   // 지도별 지역 변수(다중 지도 공존 대비)
      const feats = window.KOREA_PROVINCES.features
        .filter(f=>PROV2CODE[f.properties.name])
        // 북한 강원도(동명 피처)는 제외 — 남한 데이터만 색칠 (위도 중심 38.6°N 이북 컷)
        .filter(f=> !(f.properties.name==='강원도' && geoLatCenter(f.geometry) > 38.6))
        .map(f=>({ type:'Feature', properties:{name:f.properties.name, color:'#e5e7eb'}, geometry:f.geometry }));
      const geo = { type:'FeatureCollection', features:feats };

      const base = window.KoreaMap.createBaseLayer({ fill:'#eef2f6', stroke:'#c7d0da', strokeWidth:1 });
      fillLayer = window.KoreaMap.createFillLayer(geo, { colorProp:'color', fillAlpha:0.78, strokeAlpha:0.9, strokeWidth:1.1, zIndex:3 });
      if(!fillLayer) return null;

      // 각 도의 폴리곤 내부 중심점 계산 → 마커를 지역 중앙에 정렬.
      // 한 코드에 여러 피처(예: GG=경기도+서울+인천)가 있으면 '가장 큰 피처(=실제 도)'를 기준으로 삼는다.
      try{
        const bestArea = {};
        fillLayer.getSource().getFeatures().forEach(ft=>{
          const code = PROV2CODE[ft.get('name')]; if(!code) return;
          const g = ft.getGeometry(); if(!g) return;
          let poly = null;
          if(g.getType()==='Polygon') poly = g;
          else if(g.getType()==='MultiPolygon'){ let ba=-1; g.getPolygons().forEach(p=>{ const a=p.getArea(); if(a>ba){ ba=a; poly=p; } }); }
          if(!poly) return;
          const area = poly.getArea();
          if(area > (bestArea[code]||0)){ bestArea[code]=area; AUTO_CENTROID[code]=poly.getInteriorPoint().getCoordinates().slice(0,2); }
        });
      }catch(e){ /* 계산 실패 시 CENTROID 폴백 사용 */ }

      const map = new ol.Map({
        target: targetEl,
        layers: base ? [base, fillLayer] : [fillLayer],
        view: window.KoreaMap.createView({ center:MAP_CENTER, zoom:MAP_ZOOM, minZoom:6, maxZoom:9 }),
        controls: []
      });

      let markers=[];   // 날씨 이모지 오버레이

      return {
        map,
        setRegionFill(code,color){
          fillLayer.getSource().getFeatures().forEach(ft=>{
            if(PROV2CODE[ft.get('name')]===code) ft.set('color', color);
          });
        },
        // dialect_awareness.html과 동일한 이모지 날씨 마커를 각 권역 중심에 표시
        setWeatherMarkers(w, gen){
          markers.forEach(o=>map.removeOverlay(o)); markers=[];
          REGION_ORDER.forEach(code=>{
            const c=markerCoord(code); if(!c) return;
            const cel=cellOf(w, gen, code);
            const wk=cel.state;
            const el=document.createElement('div');
            el.className='gs-olmarker';
            el.title=(REGION_NAMES[code]||code)+(SITE_NAMES[code]?`(${SITE_NAMES[code]})`:'')+' · '+WEATHERS[wk].label+(casesText(cel)?' · '+casesText(cel):'');
            el.innerHTML = isPlain(wk)
              ? `<div class="gs-olring"><div class="gs-ollabel gs-ollabel--plain"><span class="nm">${REGION_NAMES[code]||code}</span> <span class="gs-olnote">${cellText(cel)}</span></div></div>`
              : `<div class="gs-olring"><div class="gs-olemoji">${EMOJI[wk]}</div><div class="gs-ollabel"><span class="nm">${REGION_NAMES[code]||code}</span> <span class="gs-olpct" style="color:${HEXVAR[wk]}">${cellLabel(cel)}</span></div></div>`;
            const ov=new ol.Overlay({ element:el, stopEvent:false, positioning:'center-center' });
            ov.setPosition(c);
            map.addOverlay(ov); markers.push(ov);
          });
        },
        // 범용 마커: builder(code)가 HTML 문자열(또는 null) 반환 — 계열 지도 등 재사용
        setCustomMarkers(builder){
          markers.forEach(o=>map.removeOverlay(o)); markers=[];
          REGION_ORDER.forEach(code=>{
            const c=markerCoord(code); if(!c) return;
            const html=builder(code); if(html==null) return;
            const el=document.createElement('div'); el.className='gs-olmarker'; el.innerHTML=html;
            const ov=new ol.Overlay({ element:el, stopEvent:false, positioning:'center-center' });
            ov.setPosition(c); map.addOverlay(ov); markers.push(ov);
          });
        },
        onRegionClick(handler){
          map.on('click', evt=>{
            const ft = map.forEachFeatureAtPixel(evt.pixel, f=>f);
            if(ft){ const code=PROV2CODE[ft.get('name')]; if(code) handler(code, evt); }
            else hidePopover();
          });
        },
        setFillVisible(v){ fillLayer.setVisible(v); },
        setMarkersVisible(v){ markers.forEach(o=>{ const el=o.getElement(); if(el) el.style.display = v?'':'none'; }); },
        target: targetEl,
        clear(){ if(olMap){ olMap.setTarget(undefined); olMap=null; } }
      };
    }

    function paintMap(adapter, w, gen){
      REGION_ORDER.forEach(code=>{
        adapter.setRegionFill(code, HEXVAR[cellOf(w, gen, code).state]);
      });
      adapter.setWeatherMarkers(w, gen);
      syncRegionList(w);
    }

    function initMap(w){
      const target=document.getElementById('gs-map');
      if(!target) return;
      if(olMap){ olMap.setTarget(undefined); olMap=null; }
      stopPlay();

      const adapter=createMapAdapter(target);
      if(!adapter){
        const fb=document.getElementById('gsMapFallback');
        if(fb){ fb.style.display='flex';
          fb.innerHTML = '지도를 불러오지 못했습니다. 지역별 현황: '
            + REGION_ORDER.map(c=>`${REGION_NAMES[c]} ${cellLabel(cellOf(w,0,c))}`).join(' · '); }
        return;
      }
      olMap=adapter.map;
      paintMap(adapter, w, currentGen);

      adapter.onRegionClick((code, evt)=> showPopover(w, code, evt));

      // 지도 위치 초기화
      const reset=document.getElementById('gsMapReset');
      if(reset) reset.addEventListener('click',()=>{
        const v=adapter.map.getView(); hidePopover();
        v.animate({ center: ol.proj.fromLonLat(MAP_CENTER), zoom: MAP_ZOOM, duration:300 });
      });

      // 세대 스위치
      const sw=document.getElementById('gsGenSwitch');
      bindGenRows = (box)=> box.querySelectorAll('button').forEach(b=>{
        b.addEventListener('click',()=>{
          currentGen=+b.dataset.gen;
          currentSex=b.dataset.sex||'';
          box.querySelectorAll('button').forEach(x=>x.classList.toggle('is-active',x===b));
          paintMap(adapter,w,currentGen); hidePopover(); syncRegionList(w);
        });
      });
      if(sw) bindGenRows(sw);
      // 성별로 나눠 보기 — 목록을 3줄/6줄로 바꾸고, 끄면 성별 선택도 푼다
      const sxToggle=document.getElementById('gsSexSplit');
      if(sxToggle) sxToggle.addEventListener('change',function(){
        splitSex=this.checked;
        if(!splitSex) currentSex='';
        else if(currentGen===0) currentGen=70;      // 전체 보기에는 성별 축이 없다
        if(splitSex && !currentSex) currentSex='M';
        syncGenRows(w); paintMap(adapter,w,currentGen); hidePopover(); syncRegionList(w);
      });
      // 전선 남하 재생 (70→50→20) — prefers-reduced-motion 존중
      const play=document.getElementById('gsPlay');
      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if(play) play.addEventListener('click',()=>{
        if(playTimer){ stopPlay(); return; }
        if(reduce){ currentGen=20; syncGenSwitch(); paintMap(adapter,w,20); syncRegionList(w); return; }
        const seq=[70,50,20]; let i=0;
        play.innerHTML='<i class="ti ti-player-stop" aria-hidden="true"></i>';
        play.classList.add('is-playing');
        play.title='정지'; play.setAttribute('aria-label','정지');
        const step=()=>{ currentGen=seq[i]; syncGenSwitch(); paintMap(adapter,w,currentGen); hidePopover(); syncRegionList(w);
          i=(i+1)%seq.length; playTimer=setTimeout(step, i===0?1700:1100); };
        step();
      });

      wireMapToolbar(adapter, w);
    }

    /* ── 지도 도구모음 (지도 설정 / 다운로드) ─────────────── */
    function wireMapToolbar(adapter, w){
      const $=id=>document.getElementById(id);
      const closeAllPop=()=>document.querySelectorAll('#jiyeoeo-gisangdo-root .gs-popmenu').forEach(p=>p.hidden=true);
      const bindPop=(btnId,popId)=>{ const b=$(btnId),p=$(popId); if(!b||!p) return;
        b.addEventListener('click',e=>{ e.stopPropagation(); const open=p.hidden; closeAllPop(); p.hidden=!open; b.setAttribute('aria-expanded',String(open)); });
        p.addEventListener('click',e=>e.stopPropagation());
      };
      bindPop('gsBtnSettings','gsPopSettings');
      bindPop('gsBtnDownload','gsPopDownload');

      // 지도 레이어(하천·철도·도로·산맥) — KoreaMap.attachOverlays
      let overlays=null, regionCtl=null;
      const ensureOverlays=()=>{ if(!overlays && window.KoreaMap && window.KoreaMap.attachOverlays) overlays=window.KoreaMap.attachOverlays(adapter.map); return overlays; };
      [['gsOvRivers','rivers'],['gsOvRail','rail'],['gsOvRoads','roads'],['gsOvMountains','mountains']].forEach(([id,key])=>{
        const cb=$(id); if(cb) cb.addEventListener('change',()=>{ const ov=ensureOverlays(); if(ov) ov.show(key, cb.checked); });
      });
      const ensureRegionCtl=()=>{ if(!regionCtl && window.KoreaMap && window.KoreaMap.attachRegionLayers) regionCtl=window.KoreaMap.attachRegionLayers(adapter.map,{sidoVisible:false,sigunguVisible:false}); return regionCtl; };
      const lblSido=$('gsLblSido');
      if(lblSido) lblSido.addEventListener('change',()=>{ const c=ensureRegionCtl(); if(c) c.showSido(lblSido.checked); });
      const lblSigungu=$('gsLblSigungu');
      if(lblSigungu) lblSigungu.addEventListener('change',()=>{ const c=ensureRegionCtl(); if(c) c.showSigungu(lblSigungu.checked); });
      const hideIcon=$('gsHideIcon'); if(hideIcon) hideIcon.addEventListener('change',()=>adapter.setMarkersVisible(!hideIcon.checked));
      const hideArea=$('gsHideArea'); if(hideArea) hideArea.addEventListener('change',()=>adapter.setFillVisible(!hideArea.checked));

      // 다운로드 — PNG / 인쇄용
      const dlImage=$('gsDlImage');
      if(dlImage) dlImage.addEventListener('click',()=>{ closeAllPop(); withMapCanvas(adapter, w, cv=>triggerDownload(cv.toDataURL('image/png'), `지역어기상도_${w.standard}_${currentGen}대${currentSex==='M'?'남':currentSex==='F'?'여':''}.png`)); });
      const dlPdf=$('gsDlPdf');
      if(dlPdf) dlPdf.addEventListener('click',()=>{ closeAllPop(); withMapCanvas(adapter, w, cv=>{
        const url=cv.toDataURL('image/png'); const win=window.open('','_blank');
        if(!win){ alert('팝업이 차단되어 인쇄 창을 열 수 없습니다.'); return; }
        win.document.write(`<html><head><title>지역어 기상도 - ${w.standard}</title></head><body style="margin:0"><img src="${url}" style="width:100%" onload="setTimeout(function(){window.focus();window.print();},300)"></body></html>`);
        win.document.close();
      }); });
    }

    // OL 캔버스 + 이모지·제목을 하나의 캔버스로 합성
    function withMapCanvas(adapter, w, cb){
      const olm=adapter.map, target=adapter.target; if(!olm||!target) return;
      olm.once('rendercomplete',()=>{
        const size=olm.getSize();
        const out=document.createElement('canvas'); out.width=size[0]; out.height=size[1];
        const ctx=out.getContext('2d');
        ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,out.width,out.height);
        target.querySelectorAll('canvas').forEach(cv=>{
          if(cv.width===0) return;
          const op=cv.parentNode.style.opacity||cv.style.opacity;
          ctx.globalAlpha = op===''?1:Number(op);
          const m=/^matrix\(([^)]*)\)$/.exec(cv.style.transform);
          if(m){ const v=m[1].split(',').map(Number); ctx.setTransform(v[0],v[1],v[2],v[3],v[4],v[5]); }
          else ctx.setTransform(1,0,0,1,0,0);
          ctx.drawImage(cv,0,0);
        });
        ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1;
        // 날씨 이모지 + 점수
        const hideIcon=document.getElementById('gsHideIcon');
        if(!(hideIcon&&hideIcon.checked)){
          ctx.textAlign='center'; ctx.textBaseline='middle';
          REGION_ORDER.forEach(code=>{
            const c=markerCoord(code); if(!c) return;
            const px=olm.getPixelFromCoordinate(c); if(!px) return;
            const cel=cellOf(w, currentGen, code); const wk=cel.state;
            const plain=isPlain(wk); const lab=plain?cellText(cel):cellLabel(cel);
            if(!plain){ ctx.font='26px sans-serif'; ctx.fillStyle='#000'; ctx.fillText(EMOJI[wk], px[0], px[1]-6); }
            ctx.font=(plain?'':'bold ')+'12px sans-serif'; ctx.lineWidth=3; ctx.strokeStyle='rgba(255,255,255,.92)';
            ctx.strokeText(lab, px[0], px[1]+16);
            ctx.fillStyle=plain?'#94a3b8':'#0f172a'; ctx.fillText(lab, px[0], px[1]+16);
          });
        }
        // 제목 · 출처
        ctx.textAlign='left'; ctx.textBaseline='alphabetic';
        ctx.fillStyle='#0f172a'; ctx.font='bold 18px sans-serif';
        ctx.fillText(`'${w.standard}' 방언 기상도 · ${currentGen?currentGen+'대'+(currentSex?(currentSex==='M'?' 남':' 여'):''):'전 세대'}`, 16, 28);
        ctx.fillStyle='#64748b'; ctx.font='12px sans-serif';
        ctx.fillText('국립국어원 · 지역어 기상도', 16, size[1]-14);
        cb(out);
      });
      olm.renderSync();
    }
    function triggerDownload(href, filename){
      const a=document.createElement('a'); a.href=href; a.download=filename;
      document.body.appendChild(a); a.click(); a.remove();
    }
    let _toast=null;
    function showToast(msg){
      const root=document.getElementById('jiyeoeo-gisangdo-root'); if(!root) return;
      if(!_toast){ _toast=document.createElement('div'); _toast.className='gs-toast'; root.appendChild(_toast); }
      _toast.innerHTML=`<i class="ti ti-check" aria-hidden="true"></i> ${msg}`;
      _toast.classList.add('is-show');
      clearTimeout(showToast._t); showToast._t=setTimeout(()=>_toast.classList.remove('is-show'),2400);
    }
    /* 세대 줄 마크업 — 처음 그릴 때(cardHTML)와 성별 토글 시(syncGenRows)가 같은 것을 쓴다 */
    function genRowsHTML(w){
      const rows = [70,50,20].flatMap(g => (splitSex ? [[g,'M'],[g,'F']] : [[g,'']]));
      return rows.map(([g,sx])=>{
        const t=genTally(w,g,sx); const wk=(t.n && t.score!=null)?weatherOf(t.score).key:'w0';
        const on=(g===currentGen && sx===currentSex);
        return `<button type="button" class="gs-genrow ${on?'is-active':''}" data-gen="${g}" data-sex="${sx}"
                  title="${t.n?(t.agg?`제보자 ${t.people}명의 응답 ${t.n}건 중 ${t.used}건이 '지금도 씀'`
                                     :`${t.n}명 중 ${t.used}명이 지금도 쓴다고 답함`)
                              :'이 조건에서는 지역어형이 조사되지 않았습니다'}">
          <span class="gr-emoji">${t.n?EMOJI[wk]:''}</span>
          <span class="gr-gen">${g}대${sx?`<em class="gr-sex">${sx==='M'?'남':'여'}</em>`:''}</span>
          <span class="gr-bar"><span style="width:${t.score!=null?Math.round(t.score):0}%;background:${CSSVAR[wk]}"></span></span>
          <span class="gr-rate" style="color:${t.n?CSSVAR[wk]:'#94a3b8'};font-size:12px">${
            t.n ? `${Math.round(t.score)}점 <em class="gr-n">${t.agg?`${t.people}명`:`${t.used}/${t.n}명`}</em>` : '—'}</span>
        </button>`;
      }).join('');
    }
    /* 성별 토글 뒤 세대 줄만 다시 그린다. 다시 그리면 이벤트가 날아가니 함께 붙인다. */
    let bindGenRows = null;
    function syncGenRows(w){
      const sw=document.getElementById('gsGenSwitch'); if(!sw) return;
      const first = sw.querySelector('[data-gen="0"]');
      if(first) first.classList.toggle('is-active', currentGen===0);   // 활성 표시가 남지 않게
      sw.innerHTML = (first ? first.outerHTML : '') + genRowsHTML(w);
      if(bindGenRows) bindGenRows(sw);
    }
    function syncGenSwitch(){
      const sw=document.getElementById('gsGenSwitch'); if(!sw) return;
      sw.querySelectorAll('button').forEach(b=>b.classList.toggle('is-active',
        +b.dataset.gen===currentGen && (b.dataset.sex||'')===currentSex));
    }
    function stopPlay(){ if(playTimer){ clearTimeout(playTimer); playTimer=null; }
      const play=document.getElementById('gsPlay'); if(!play) return;
      play.innerHTML='<i class="ti ti-player-play" aria-hidden="true"></i>';
      play.classList.remove('is-playing');
      play.title='70 → 20대 순서로 넘겨 보기'; play.setAttribute('aria-label','세대별로 넘겨 보기'); }

    /* 지역을 누르면 그 지역에서 조사된 말을 보여준다.
       세대별 표는 지도 색·우측 패널과 같은 것을 세 번째로 말하고 있어 걷어냈다. */
    function showPopover(w, code, evt){
      const pop=document.getElementById('gsMapPop'); if(!pop) return;
      const panel=document.querySelector('#jiyeoeo-gisangdo-root .gs-mappanel');
      const rect=panel.getBoundingClientRect();
      const all=cellOf(w,0,code);
      const chips=(list,cls)=>(list||[]).map(f=>
        `<i class="gs-rl__w ${cls}">${esc(f.form)}</i>`).join('');
      const heads=all.heads||[], bases=all.bases||[];
      const body = isAll(w)
        ? `<div class="gs-popnote">단어를 하나 고르면 그 지역에서 조사된 말이 나옵니다.</div>`
        : `<div class="gs-poprow"><span class="gs-rl__k">표준어형</span>
             <span class="gs-rl__v">${heads.length?chips(heads,'is-head'):'<u>—</u>'}</span></div>
           <div class="gs-poprow"><span class="gs-rl__k">방언형</span>
             <span class="gs-rl__v">${bases.length?chips(bases,'is-base'):'<u>조사된 방언형 없음</u>'}</span></div>`;
      pop.innerHTML=`
        <div class="gs-pophead">
          <div class="gs-pophead__title">
            <span class="gs-pophead__region">${REGION_NAMES[code]}</span>
            <span>${SITE_NAMES[code]||''}</span>
          </div>
          <button type="button" class="gs-popclose" id="gsPopClose" aria-label="닫기"><i class="ti ti-x"></i></button>
        </div>
        <div class="gs-popbody">${body}</div>`;
      pop.classList.remove('gs-pop--below');
      pop.classList.add('is-open');
      const closer=document.getElementById('gsPopClose');
      if(closer) closer.onclick=(e)=>{ e.stopPropagation(); hidePopover(); };

      // 말풍선을 클릭 지점 위에 가로 중앙 정렬, 공간이 없으면 아래로 뒤집음
      const pw=pop.offsetWidth, ph=pop.offsetHeight;
      let x=evt.pixel[0];
      x=Math.max(pw/2+6, Math.min(x, rect.width-pw/2-6));
      let y=evt.pixel[1]-ph-14;
      if(y<6){ pop.classList.add('gs-pop--below'); y=evt.pixel[1]+14; }
      pop.style.left=x+'px'; pop.style.top=y+'px';
    }
    function hidePopover(){ const p=document.getElementById('gsMapPop'); if(p) p.classList.remove('is-open'); }

    /* ── 라우팅 §3 (해시) ─────────────────────────────────────── */
    function route(){
      stopPlay();
      const h=(location.hash||'#/home').replace(/^#/,'');
      if(h.startsWith('/word/')){ renderWord(h.split('/')[2]); }
      else if(h.startsWith('/alert')){ location.hash='#/home'; return; }
      else { renderHome(); }
      window.scrollTo({top:0, behavior:'instant' in window ? 'instant':'auto'});
    }
    function nav(to, id){
      if(to==='home') location.hash='#/home';
      else if(to==='word') location.hash='#/word/'+id;
    }
    function wireNav(root){
      root.querySelectorAll('[data-nav]').forEach(el=>{
        el.addEventListener('click',()=>nav(el.dataset.nav, el.dataset.id));
        el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); nav(el.dataset.nav, el.dataset.id); }});
      });
    }

    /* ── 단어 선택 패널 (WordSearch §6.1) — our_town .map-pick 방식 ── */
    const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
    const CHO14=['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ']; // 표준 초성 버튼(된소리는 기본자음으로 접음)
    const CHO_FOLD={'ㄲ':'ㄱ','ㄸ':'ㄷ','ㅃ':'ㅂ','ㅆ':'ㅅ','ㅉ':'ㅈ'};
    function choseong(s){ const c=(s||'').charCodeAt(0)-0xAC00; const ch=(c<0||c>11171)?(s[0]||''):CHO[Math.floor(c/588)]; return CHO_FOLD[ch]||ch; }
    let pickInitial='ㄱ', pickQuery='', pickCollapsed=false;

    function filterWords(){
      const q=pickQuery.trim();
      return WORDS.filter(w=>{
        // '전체'(통합)는 자모 분류가 없다 — 자모를 고르거나 검색 중이면 숨긴다
        if(w.itemId==='__ALL__') return pickInitial==='전체' && !q;
        if(pickInitial!=='전체' && choseong(w.standard)!==pickInitial) return false;
        if(!q) return true;
        if(w.standard.includes(q)) return true;
        return topForms(w, 99).some(f=>f.includes(q));   // 실측 어형으로도 찾기
      });
    }
    function gridHTML(list){
      if(!list.length) return `<div class="gs-wgrid-empty">검색 결과가 없습니다</div>`;

        return `<button type="button" class="gs-wbtn${all?' is-all':''} ${w.itemId===currentWordId?'is-active':''}" data-id="${w.itemId}" role="option" aria-selected="${w.itemId===currentWordId}"${all?' title="조사된 101개 단어를 한 장으로 — 지역별 평균 점수"':''}>${all?'전체 101개':w.standard}</button>`;
      }).join('');
    }

            <g class="gs-intro__pin"><circle cx="76" cy="38" r="7.5" fill="#10b981"/><circle cx="76" cy="38" r="2.8" fill="#fff"/></g>

          </svg>
        </div>

        <div class="gs-intro__msg">
          <span class="gs-intro__badge"><i class="ti ti-map-pin" aria-hidden="true"></i> 지역어 기상도</span>

            한눈에 확인할 수 있어요.</span></p>

          <p class="gs-pick__label"><i class="ti ti-vocabulary" aria-hidden="true"></i> 단어 고르기
            <span class="gs-pick__count">${WORDS.filter(x=>x.itemId!=='__ALL__').length}개</span></p>
          <button type="button" class="gs-pick__toggle" id="gsPickToggle" aria-expanded="${!pickCollapsed}">
            <span id="gsPickToggleLabel">${pickCollapsed?'목록 펼치기':'목록 접기'}</span>
            <i class="ti ti-chevron-down gs-pick__chev" aria-hidden="true"></i>
          </button>

        <div class="gs-searchrow">
          <div class="gs-wordsearch ${pickQuery?'has-value':''}" id="gsWSWrap">
            <i class="ti ti-search gs-wordsearch__ico" aria-hidden="true"></i>
            <input type="search" class="gs-wordsearch__input" id="gsWS" placeholder="방언형·표준어형 검색 (예: 나락, 벼)" autocomplete="off" aria-label="단어 검색" value="${pickQuery.replace(/"/g,'&quot;')}">
            <button type="button" class="gs-wordsearch__clear" id="gsWSClear" aria-label="검색어 지우기"><i class="ti ti-x" aria-hidden="true"></i></button>

    function regrid(){
      const g=document.getElementById('gsWordGrid'); if(g) g.innerHTML=gridHTML(filterWords());
    }
    function wirePickPanel(root){
      const pick=root.querySelector('#gsPick');
      const toggle=root.querySelector('#gsPickToggle');
      if(toggle) toggle.addEventListener('click',()=>{
        pickCollapsed=!pickCollapsed;
        pick.classList.toggle('is-collapsed',pickCollapsed);
        toggle.setAttribute('aria-expanded', String(!pickCollapsed));
        root.querySelector('#gsPickToggleLabel').textContent = pickCollapsed?'목록 펼치기':'목록 접기';
      });
      const expand=()=>{ if(!pickCollapsed) return; pickCollapsed=false; pick.classList.remove('is-collapsed');
        if(toggle) toggle.setAttribute('aria-expanded','true');
        const lbl=root.querySelector('#gsPickToggleLabel'); if(lbl) lbl.textContent='목록 접기'; };
      const ws=root.querySelector('#gsWS'), wsWrap=root.querySelector('#gsWSWrap'), wsClear=root.querySelector('#gsWSClear');
      const doSearch=()=>{ pickQuery=ws?ws.value:''; if(wsWrap) wsWrap.classList.toggle('has-value',!!pickQuery); expand(); regrid(); };
      if(ws){
        ws.addEventListener('input',()=>{ pickQuery=ws.value; wsWrap.classList.toggle('has-value',!!pickQuery); regrid(); });
        ws.addEventListener('keydown',e=>{
          if(e.key==='Enter'){ e.preventDefault(); doSearch(); }
          else if(e.key==='Escape'){ ws.value=''; pickQuery=''; wsWrap.classList.remove('has-value'); regrid(); }
        });
      }
      const searchBtn=root.querySelector('#gsSearchBtn');
      if(searchBtn) searchBtn.addEventListener('click', doSearch);
      if(wsClear) wsClear.addEventListener('click',()=>{ pickQuery=''; ws.value=''; wsWrap.classList.remove('has-value'); regrid(); ws.focus(); });
      const inits=root.querySelector('#gsInitials');
      if(inits) inits.addEventListener('click',e=>{
        const b=e.target.closest('.gs-initial'); if(!b) return;
        pickInitial=b.dataset.ini;
        inits.querySelectorAll('.gs-initial').forEach(x=>x.classList.toggle('is-active',x===b));
        regrid();
      });
      const grid=root.querySelector('#gsWordGrid');
      if(grid) grid.addEventListener('click',e=>{
        const b=e.target.closest('.gs-wbtn'); if(!b) return;
        currentWordId=b.dataset.id;
        grid.querySelectorAll('.gs-wbtn').forEach(x=>{ const on=x===b; x.classList.toggle('is-active',on); x.setAttribute('aria-selected',String(on)); });
        renderHomeDetail();
        document.getElementById('gsHomeDetail').scrollIntoView({behavior:'smooth',block:'start'});
      });
    }

    /* ── 초기화 ───────────────────────────────────────────────── */
    function boot(){
      // 딥링크로 모드 지정 가능 (?mode=expert) — 이후 세션 유지 §3
      // 지도 도구 팝오버: 바깥 클릭 시 닫기 & 범례 아코디언 토글
      document.addEventListener('click', e=>{
        document.querySelectorAll('#jiyeoeo-gisangdo-root .gs-popmenu').forEach(p=>p.hidden=true);
        const toggle = e.target.closest('.gs-map-legend-acc__toggle');
        if(toggle){
          const acc = toggle.closest('.gs-map-legend-acc');
          if(acc){
            const collapsed = acc.classList.toggle('is-collapsed');
            toggle.setAttribute('aria-expanded', String(!collapsed));
          }
        }
      });
      window.addEventListener('hashchange', route);
      loadAware().then(route);
    }
    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  })();
