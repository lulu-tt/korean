								<div class="table table-row">
									<div class="table-inner">
										<table>
											<caption class="sr-only">
												관리자 아이피관리

											<tbody>
												<tr>
													<th scope="row">
														<span>허용여부<i class="req">필수입력</i></span>
													</th>
													<td>
														<div class="input-group">
															<label class="check-item">
																<input type="radio" name="radio1" checked required />

															</label>
															<label class="check-item">
																<input type="radio" name="radio1" required />

															</label>
														</div>
													</td>
												</tr>
												<tr>
													<th scope="row">
														<span>허용 IP<i class="req">필수입력</i></span>
													</th>
													<td>
														<div class="input-group ip-group">
															<div class="input-group">
																<input type="text" title="ip 번호 입력" class="form-control" required />

															<button type="button" class="btn btn-md btn-outline-gray">
																<i class="ico ico-search-darkgray-md"></i>
																<span class="text text-md">중복 확인</span>
															</button>
														</div>
														<!-- IP 사용 가능 시 노출 문구 -->
														<span class="text-guide text-primary"> 이 아이피는 사용할 수 있어요. </span>

														<!-- IP 중복되어 사용 불가일 경우 노출 문구 -->
														<span class="text-guide text-invalid"> 이 아이피는 이미 사용중이에요. </span>

												<tr>
													<th scope="row">
														<label for="input_name">성명<i class="req">필수입력</i></label>
													</th>
													<td>
														<input

															id="input_name"
															class="form-control full"
															placeholder="성명을 입력해주세요."

														/>

												</tr>
												<tr>
													<th scope="row">
														<label for="textarea1">설명</label>

													<td>
