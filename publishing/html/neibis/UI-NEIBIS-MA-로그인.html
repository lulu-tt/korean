		<div class="loadingbar">
			<div class="progress"></div>

		</div>
		<div class="wrapper">
			<div id="container">
				<article id="content">

						<!-- 본문 영역 -->

						<div class="login-area">

									<img src="/assets/neibis/images/logo.png" alt="neibis" />

								<h1 class="title">로그인</h1>
								<p class="subject">로그인 후 콘텐츠를 손쉽게 관리해보세요.</p>

								<form action="UI-NEIBIS-MA-대시보드.html">
									<fieldset>
										<legend class="sr-only">로그인 정보 입력</legend>
										<div class="input-area">
											<div class="row">
												<label for="userId">아이디</label>
												<input
													type="text"
													id="userId"
													class="form-control"
													placeholder="아이디를 입력해주세요."
													title="아이디를 입력해주세요."
												/>
											</div>
											<div class="row">
												<label for="userPw">비밀번호</label>

												<!-- 2023-05-12 수정내역 : 비밀번호 구조 변경 input-group pw-group 추가 -->
												<div class="input-group pw-group">
													<input
														type="password"
														id="userPw"
														class="form-control form-pw"
														placeholder="비밀번호를 입력해주세요."
														title="비밀번호를 입력해주세요."
													/>
													<button type="button" class="btn btn-pw btn-pw-off">비밀번호 확인</button>
												</div>
											</div>
											<div class="mt-lg-5 mt-md-3">
												<span class="check-item">
													<input type="checkbox" id="inputKeep" />
													<label for="inputKeep">아이디 기억</label>
												</span>
											</div>
											<p class="text-guide mt-5">
												<i class="ico ico-exclamation-md"></i>
												<span
													>아이디 또는 비밀번호를 잘못 입력했습니다.<br class="d-down-sm" />
													입력하신 내용을 다시 확인해주세요.</span
												>
											</p>
										</div>

										<div class="btn-area">
											<button type="submit" class="btn btn-lg btn-primary btn-block">로그인</button>
										</div>
									</fieldset>
								</form>
