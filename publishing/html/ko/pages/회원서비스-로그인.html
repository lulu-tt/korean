<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>로그인 | 지역어 종합 정보</title>
		<link rel="icon" href="../../../assets/_common/images/favicon.ico" />

		<!-- CSS -->
		<link rel="stylesheet" href="../../../assets/ko/css/style.css" />

		<!-- JavaScript -->
		<script src="../../../assets/_common/js/ui-global.js" defer></script>

		<!-- TODO : 퍼블용 JS, 개발시 반영 금지 -->
		<script src="../../../assets/_guide/js/ui-include.js" defer></script>

		<!-- 페이지 개별 스크립트 -->
		<script>
			document.addEventListener("DOMContentLoaded", function () {
				//  TODO : 퍼블용 비밀번호 폼 UI 구현 스크립트, 개발시 확인 필요
				var toggleBtn = document.querySelector(".input-password-toggle");
				var pwdInput = document.getElementById("login-pwd");

				toggleBtn.addEventListener("click", function () {
					var isVisible = pwdInput.type === "text";
					pwdInput.type = isVisible ? "password" : "text";
					toggleBtn.setAttribute("aria-pressed", String(!isVisible));
					toggleBtn.querySelector(".svg-icon").classList.toggle("ico-pw-visible-off", isVisible);
					toggleBtn.querySelector(".svg-icon").classList.toggle("ico-pw-visible-on", !isVisible);
				});
				//
			});
		</script>
	</head>
	<body>
		<div class="wrap">
			<!-- [퍼블용 include]: [include] 표기 부분은 실제 서버 include로 교체 필요 -->

			<!-- [include]:본문 바로가기 -->
			<div w3-include-html="../_include/inc-skipnav.html"></div>
			<!-- [include]:상단 배너 -->
			<div class="masthead" w3-include-html="../_include/inc-masthead.html"></div>
			<!-- [include]:헤더  -->
			<header class="header" w3-include-html="../_include/inc-header.html"></header>

			<div id="container" class="container">
				<!----- 콘텐츠 영역 ----->

				<div class="inner" id="contents">
					<!-- 브레드 크럼 -->
					<nav class="breadcrumb" aria-label="현재 위치">
						<ol class="breadcrumb-list">
							<li class="breadcrumb-item home">
								<a href="#"><i class="svg-icon ico-bread-home ico-sm" aria-hidden="true"></i>홈</a>
							</li>
						</ol>
					</nav>
					<!-- // -->

					<div class="content-header">
						<h1 class="content-title">로그인</h1>
					</div>

					<div class="content-body">
						<div class="login-wrap">
							<form class="login-form" novalidate>
								<div class="login-field">
									<label class="form-label" for="login-id">아이디</label>
									<input
										type="text"
										id="login-id"
										class="input input-xl border-gray-dark"
										placeholder="아이디를 입력하세요"
									/>
								</div>

								<div class="login-field">
									<label class="form-label" for="login-pwd">비밀번호</label>
									<div class="input-password-wrap">
										<input
											type="password"
											id="login-pwd"
											class="input input-xl border-gray-dark"
											placeholder="비밀번호를 입력하세요"
										/>
										<button type="button" class="input-password-toggle" aria-pressed="false">
											<i class="svg-icon ico-xl ico-pw-visible-off" aria-hidden="true"></i>
											<!-- <i class="svg-icon ico-xl ico-pw-visible-on" aria-hidden="true"></i> -->
											<span class="sr-only">비밀번호 표시</span>
										</button>
									</div>
								</div>

								<div class="login-field login-help-field">
									<label class="form-checkbox" for="inputKeep"
										><input type="checkbox" id="inputKeep" />아이디 저장</label
									>
									<p class="login-danger-text">
										<i class="svg-icon ico-error-fill"></i>
										<span>Caps Lock이 켜져있어요</span>
									</p>
								</div>

								<button type="submit" class="btn btn-primary btn-xxl">로그인</button>
							</form>

							<div class="login-links">
								<a href="#" class="btn-text btn-md">아이디 찾기</a>
								<span class="divider" aria-hidden="true"></span>
								<a href="#" class="btn-text btn-md">비밀번호 찾기</a>
							</div>

							<div class="box box-gray login-notice-box mt-10">
								<div class="login-notice-info">
									<a href="#" class="login-notice-logo">
										<img src="../../../assets/_common/images/logo-dialect@2x.png" alt="지역어 종합 정보 로고" />
									</a>
									<p class="login-notice-desc">
										국립국어원 지역어 종합 정보 회원이 되시면<br />
										누리집의 다양한 서비스를 경험하실 수 있습니다.
									</p>
								</div>
								<div class="login-notice-action">
									<a href="#" class="btn btn-lg btn-secondary md-full">회원가입</a>
								</div>
							</div>
						</div>
					</div>
				</div>
				<!----- //콘텐츠 영역 ----->

				<button type="button" class="page-top-button" aria-label="맨 위로 이동">
					<i class="svg-icon ico-go-top" aria-hidden="true"></i>
				</button>
			</div>

			<!-- [include]:푸터  -->
			<footer class="footer" w3-include-html="../_include/inc-footer.html"></footer>
			<!-- [include]:비밀번호 확인 팝업 -->
			<div w3-include-html="../_include/inc-modal-pwd-confirm.html"></div>
		</div>
	</body>
</html>
