<dialog class="modal" id="modal-pwd-confirm" aria-labelledby="modal-pwd-confirm-title" aria-modal="true">
	<div class="popup-inner">
		<div class="popup-header">
			<h2 class="popup-title" id="modal-pwd-confirm-title">비밀번호 확인</h2>
		</div>
		<div class="popup-body">
			<p>회원님의 정보를 안전하게 보호하기 위해 비밀번호를 다시 한 번 확인합니다.</p>

			<div class="pwd-confirm-wrap mt-4">
				<label class="form-label" for="pwd-confirm-id">아이디</label>
				<input
					type="text"
					id="pwd-confirm-id"
					class="input input-lg is-view"
					placeholder="hanguk_user"
					style="width: 100%"
				/>
				<label class="form-label" for="pwd-confirm-input">비밀번호<span class="required">필수</span></label>
				<input
					type="password"
					id="pwd-confirm-input"
					class="input input-lg"
					placeholder="비밀번호를 입력해주세요."
					style="width: 100%"
				/>
			</div>
		</div>
		<div class="popup-footer">
			<div class="btn-group">
				<button type="button" class="btn btn-lg btn-tertiary" data-modal-close>취소</button>
				<button type="button" class="btn btn-lg btn-primary" id="pwd-confirm-submit">확인</button>
			</div>
		</div>
		<button type="button" class="btn-modal-close" data-modal-close><span class="sr-only">팝업 닫기</span></button>
	</div>
</dialog>
