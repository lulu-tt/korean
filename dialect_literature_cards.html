@keyframes lb-open { from { opacity: 0; transform: perspective(1400px) rotateY(-35deg) scale(.92); } to { opacity: 1; transform: none; } }

                 exs.filter(function (e) { return e.book_name === b.book; })[0] || exs[0];
        var d = {
          dlt: it.dlt_tp, std: String(it.std_tp || '').replace(/^대응 표준어 없음\.?$/, ''), mean: String(it.mean || '').replace(/①|②|③/g, function (m) { return ' ' + m; }).trim(),
          region: it.region_nm, also: String(it.rel_dlt || '').split(/\s*,\s*/).filter(Boolean).slice(0, 6),
          desc: firstSentences(it.word_desc, 2),
          scene: ex ? String(ex.example).replace(/\s*\/\s*/g, '\n').trim() : '', writer: ex ? ex.writer : '', book: ex ? ex.book_name : '', year: ex ? ex.publish_year : ''
        };
        cache[b.q] = d;
        return d;
      });
  }
  function firstSentences(t, n) {
    var parts = String(t || '').match(/[^.!?]+[.!?]+/g) || [String(t || '')];
    return parts.slice(0, n).join(' ').trim();
  }
  // 장면 속 방언 낱말에 형광펜 (활용형: 깨금발로·꽤구락지도 → 앞부분으로 찾기)
  function markScene(text, w) {
    var t = esc(text);
    var keys = [w, w.replace(/다$/, ''), w.slice(0, -1)];
    for (var i = 0; i < keys.length; i++) {
      var k = esc(keys[i]);
      if (k && t.indexOf(k) !== -1) return t.split(k).join('<mark>' + k + '</mark>');
    }
    return t;
  }

  function show(id) {
    ['lb-shelf-panel', 'lb-book-panel', 'lb-cards-panel'].forEach(function (p) { $(p).hidden = (p !== id); });
    document.querySelectorAll('.js-card-count').forEach(function (el) { el.textContent = Object.keys(st.cards).length; });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ── 책장: 책등에는 작품 이름과 작가만(방언 뜻은 숨김) ──
  function renderShelf() {
    var box = $('lb-shelf');
    box.innerHTML = BOOKS.map(function (b, i) {
      return '<button type="button" class="lb-book lb-b' + (i % 8) + (st.read[b.q] ? ' is-read' : '') + '" data-i="' + i + '">' +
        '<span class="lb-book__band"></span><span class="lb-book__title js-t">' + esc(b.book) + '</span><span class="lb-book__who js-w"></span></button>';
    }).join('');
    BOOKS.forEach(function (b, i) {
      loadBook(b).then(function (d) {
        var el = box.querySelector('[data-i="' + i + '"]');
        el.querySelector('.js-t').textContent = d.book;
        el.querySelector('.js-w').textContent = d.writer;
        el.setAttribute('aria-label', '「' + d.book + '」 ' + d.writer + (st.read[b.q] ? ', 읽음' : ''));
      }).catch(function () {});
    });
    document.querySelectorAll('.js-card-count').forEach(function (el) { el.textContent = Object.keys(st.cards).length; });
  }
  $('lb-shelf').addEventListener('click', function (e) {
    var b = e.target.closest('.lb-book');
    if (b) openBook(+b.dataset.i);
  });

  // ── 펼친 책: 왼쪽 장면(한 글자씩), 오른쪽 낱말 노트(눌러서 보기) ──
  var typing = null;
  function openBook(i) {
    var b = BOOKS[i];
    $('lb-book-body').innerHTML = '<p class="lb-loading">책을 펼치는 중이에요…</p>';
    show('lb-book-panel');
    loadBook(b).then(function (d) {
      st.read[b.q] = 1; save();
      var card = st.cards[b.q] || {};
      $('lb-book-body').innerHTML =
        '<div class="lb-open">' +
          '<div class="lb-pg lb-pg--l"><span class="lb-pg__tag">이야기 속 장면</span>' +
            '<p class="lb-scene" id="lb-scene" aria-label="' + esc(d.scene) + '"></p>' +
            '<p class="lb-cite"><b>' + esc(d.writer) + '</b> 「' + esc(d.book) + '」' + (d.year ? ' (' + esc(d.year) + ')' : '') + ' · ' + esc(d.region) + ' 방언</p></div>' +
          '<div class="lb-pg lb-pg--r"><span class="lb-pg__tag">낱말 노트</span>' +
            '<button type="button" class="lb-peek" id="lb-peek"><i class="ti ti-eye"></i> ‘' + esc(d.dlt) + '’ 뜻 살짝 보기</button>' +
            '<div class="lb-reveal lb-note" id="lb-note" hidden>' +
              '<div class="lb-word"><b>' + esc(d.dlt) + '</b>' + (d.std ? '<i class="ti ti-arrow-right"></i><em>' + esc(d.std) + '</em>' : '') + '</div>' +
              '<p class="lb-mean">' + esc(d.mean) + '</p>' +
              (d.also.length ? '<h3>다르게 부르는 말</h3><div class="lb-also">' + d.also.map(function (a) { return '<span>' + esc(a) + '</span>'; }).join('') + '</div>' : '') +
              (d.desc ? '<h3>알아 두면 좋아요</h3><p class="lb-desc">' + esc(d.desc) + '</p>' : '') +
            '</div></div>' +
        '</div>' +
        '<div class="lb-prep">' +
          '<h3>이 장면으로 발표해 볼까요?</h3><p>방언이 이 장면에 어떤 느낌을 주는지 골라 보세요. 정답은 없어요.</p>' +
          '<div class="lb-stickers" id="lb-stickers">' + STICKERS.map(function (s) {
            return '<button type="button" data-f="' + s[0] + '" aria-pressed="' + ((card.feel || []).indexOf(s[0]) !== -1) + '"><i class="ti ' + s[1] + '"></i>' + s[0] + '</button>';
          }).join('') + '</div>' +
          '<div class="lb-me" id="lb-me" role="group" aria-label="내 경험">' +
            ['나도 비슷한 적 있어요', '처음 보는 모습이에요'].map(function (m) { return '<button type="button" data-m="' + m + '" aria-pressed="' + (card.me === m) + '">' + m + '</button>'; }).join('') +
          '</div>' +
          '<div class="lb-actions" style="margin-top:0">' +
            '<button type="button" class="lb-btn js-to-shelf"><i class="ti ti-books"></i>책장으로</button>' +
            '<button type="button" class="lb-btn lb-btn--primary" id="lb-add">' + (st.cards[b.q] ? '<i class="ti ti-check"></i>발표 카드에 담았어요' : '<i class="ti ti-plus"></i>발표 카드에 담기') + '</button>' +
          '</div></div>';
      typeScene(d);
      $('lb-peek').addEventListener('click', function () { this.remove(); $('lb-note').hidden = false; });
      var draft = { feel: (card.feel || []).slice(), me: card.me || '' };
      $('lb-stickers').addEventListener('click', function (e) {
        var o = e.target.closest('[data-f]'); if (!o) return;
        var k = draft.feel.indexOf(o.dataset.f);
        if (k === -1) draft.feel.push(o.dataset.f); else draft.feel.splice(k, 1);
        o.setAttribute('aria-pressed', String(k === -1));
        if (st.cards[b.q]) { st.cards[b.q].feel = draft.feel.slice(); save(); }
      });
      $('lb-me').addEventListener('click', function (e) {
        var o = e.target.closest('[data-m]'); if (!o) return;
        draft.me = draft.me === o.dataset.m ? '' : o.dataset.m;
        this.querySelectorAll('[data-m]').forEach(function (x) { x.setAttribute('aria-pressed', String(x.dataset.m === draft.me)); });
        if (st.cards[b.q]) { st.cards[b.q].me = draft.me; save(); }
      });
      $('lb-add').addEventListener('click', function () {
        st.cards[b.q] = { feel: draft.feel.slice(), me: draft.me, at: Date.now() }; save();
        this.innerHTML = '<i class="ti ti-check"></i>발표 카드에 담았어요';
        document.querySelectorAll('.js-card-count').forEach(function (el) { el.textContent = Object.keys(st.cards).length; });
      });
      bindShelfBtns();
    }).catch(function () {
      $('lb-book-body').innerHTML = '<p class="lb-loading">책을 불러오지 못했어요.' +
        (/^https?:$/.test(location.protocol) ? '' : '<br>파일로 바로 열면 자료를 불러올 수 없어요. <a href="http://127.0.0.1:8765/dialect_literature_cards.html">개발 서버 주소로 열기</a>') + '</p>' +
        '<p style="text-align:center"><button type="button" class="lb-btn js-to-shelf"><i class="ti ti-books"></i>책장으로</button></p>';
      bindShelfBtns();
    });
  }

  // 장면을 한 글자씩 써 내려가고, 다 쓰면 방언 낱말에 형광펜
  function typeScene(d) {
    clearInterval(typing);
    var el = $('lb-scene'), txt = d.scene, n = 0;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { el.innerHTML = markScene(txt, d.dlt); return; }
    typing = setInterval(function () {
      n += 2;
      if (n >= txt.length) { clearInterval(typing); el.innerHTML = markScene(txt, d.dlt); return; }
      el.innerHTML = esc(txt.slice(0, n)) + '<span class="lb-cursor"></span>';
    }, 45);
    el.addEventListener('click', function () { clearInterval(typing); el.innerHTML = markScene(txt, d.dlt); }, { once: true });
  }

  // ── 발표 카드 ──
  function renderCards() {
    var keys = BOOKS.filter(function (b) { return st.cards[b.q]; });
    if (!keys.length) { $('lb-cards').innerHTML = '<p class="lb-empty">아직 담은 장면이 없어요. 책을 펼쳐 마음에 드는 장면을 담아 보세요.</p>'; return; }
    $('lb-cards').innerHTML = '<p class="lb-empty" style="padding:0 0 4px;text-align:left">불러오는 중…</p>';
    Promise.all(keys.map(loadBook)).then(function (ds) {
      $('lb-cards').innerHTML = ds.map(function (d, k) {
        var c = st.cards[keys[k].q];
        return '<article class="lb-card"><div class="lb-card__top"><span>발표 카드 ' + (k + 1) + '</span><span>' + esc(d.writer) + ' 「' + esc(d.book) + '」</span></div>' +
          '<p class="lb-card__scene">' + markScene(d.scene, d.dlt) + '</p>' +
          '<p class="lb-card__row"><b>방언</b>' + esc(d.dlt) + (d.std ? ' → ' + esc(d.std) : '') + ' (' + esc(d.region) + ')</p>' +
          '<p class="lb-card__row"><b>뜻</b>' + esc(d.mean) + '</p>' +
          '<p class="lb-card__row"><b>느낌</b>' + esc((c.feel || []).join(', ') || '—') + '</p>' +
          '<p class="lb-card__row"><b>내 경험</b>' + esc(c.me || '—') + '</p>' +
          '<p class="lb-card__row"><b>하고 싶은 말</b></p><div class="lb-card__line"></div><div class="lb-card__line"></div></article>';
      }).join('');
    });
  }
  function bindShelfBtns() {
    document.querySelectorAll('.js-to-shelf').forEach(function (b) { b.onclick = function () { clearInterval(typing); renderShelf(); show('lb-shelf-panel'); }; });
    document.querySelectorAll('.js-open-cards').forEach(function (b) { b.onclick = function () { clearInterval(typing); renderCards(); show('lb-cards-panel'); }; });
  }
  $('lb-clear').addEventListener('click', function () {
    if (!confirm('담은 발표 카드를 모두 지울까요?')) return;
    st.cards = {}; save(); renderCards(); show('lb-cards-panel');
  });

  // ── 시작 ──
  if (!/^https?:$/.test(location.protocol)) {
    var warn = document.createElement('p');
    warn.className = 'lb-warn';
    warn.innerHTML = '미리보기로 열려서, 저장해 둔 자료 사본으로 보여 드려요. 최신 자료와 전체 메뉴는 개발 서버 주소에서 볼 수 있어요: <a href="http://127.0.0.1:8765/dialect_literature_cards.html">http://127.0.0.1:8765/dialect_literature_cards.html</a>';
    document.querySelector('.lb-head').after(warn);
  }
  renderShelf();
  bindShelfBtns();
})();
</script>
</body>
</html>
