<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지역어 변이형 비교 — 국립국어원</title>
<link rel="shortcut icon" href="./favicon.ico">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="./styles.css">
<script src="./gnb.js" defer></script>
<script src="./share.js" defer></script>
<script src="./footer.js" defer></script>
<style>
  @font-face {
    font-family: 'NanumBarunGothicYetHangul';
    src: url('https://cdn.jsdelivr.net/npm/@kfonts/nanum-barun-gothic-yet-hangul-otf/NanumBarunGothic-YetHangul.woff2') format('woff2'),
         url('https://cdn.jsdelivr.net/npm/@kfonts/nanum-barun-gothic-yet-hangul-otf/NanumBarunGothic-YetHangul.woff') format('woff');
    font-weight: normal;
    font-style: normal;
  }
  html { scrollbar-gutter: stable; }
  body {
    font-family: 'Pretendard', 'NanumBarunGothicYetHangul', system-ui, -apple-system, sans-serif;
    font-variant-ligatures: normal;
    font-feature-settings: "liga" 1, "clig" 1, "ccmp" 1;
    background: #ffffff;
  }
  .container { max-width: 1440px; margin: 0 auto; padding: 40px 20px 80px; }

  /* SUB VISUAL & LOCATION (공통 서브 비주얼 - 다른 페이지와 동일) */
  .sub-visual { background: #ffffff; border-bottom: 1px solid var(--line); padding: 50px 0 40px; text-align: center; position: relative; overflow: hidden; }
  .sub-visual::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(circle at 80% 20%, rgba(37, 99, 235, 0.05) 0%, transparent 40%); pointer-events: none; }
  .sv-title { font-size: 30px; font-weight: 800; color: #1e3a8a; letter-spacing: -0.02em; margin: 0 0 16px; position: relative; z-index: 1; }
  .location-bar { display: inline-flex; align-items: center; gap: 12px; background: #ffffff; padding: 8px 24px; border-radius: 99px; box-shadow: var(--shadow2); border: 1px solid var(--line); position: relative; z-index: 1; }
  .loc-item { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #475569; }
  .loc-item.home { color: var(--blue); font-size: 16px; }
  .loc-item select { border: none; background: transparent; font-size: 14px; font-weight: 700; color: var(--text); padding: 0 20px 0 0; cursor: pointer; appearance: none; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%2364748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>') no-repeat right center; }
  .loc-item select:focus { outline: none; box-shadow: none; }
  .loc-sep { color: #cbd5e1; font-size: 14px; }

  /* INTRO */

  /* WORD PICK PANEL (초성 필터 + 단어 목록) */
  .pick-panel { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px 22px 16px; margin-bottom: 24px; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04); }
  .pick-panel__head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .pick-panel__label { font-size: 15px; font-weight: 800; color: var(--text); display: inline-flex; align-items: center; gap: 6px; margin: 0; }
  .pick-panel__count { font-size: 11px; font-weight: 700; color: var(--blue); background: var(--blue-light); border: 1px solid #bfdbfe; padding: 3px 9px; border-radius: 99px; }
  /* 단어 미선택 안내(결과 없음) 화면 */
  .empty-result { text-align: center; padding: 60px 24px; background: var(--card); border: 1px dashed var(--border-strong, #cbd5e1); border-radius: 20px; }
  .empty-result__icon { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 50%; background: var(--blue-light); color: var(--blue); display: grid; place-items: center; font-size: 30px; }
  .empty-result__title { font-size: 18px; font-weight: 800; color: var(--text); margin: 0 0 8px; letter-spacing: -0.02em; }
  .empty-result__desc { font-size: 14px; color: var(--muted); font-weight: 500; margin: 0; line-height: 1.6; }

  .word-search { position: relative; margin-bottom: 10px; }
  .word-search__input {
    width: 100%; height: 42px; padding: 0 38px; box-sizing: border-box;
    border: 1px solid #cbd5e1; border-radius: 11px; background: #fff;
    font-size: 14px; font-weight: 600; color: var(--text); font-family: inherit; outline: none; transition: 0.15s;
  }
  .word-search__input::placeholder { color: #94a3b8; font-weight: 500; }
  .word-search__input:focus { border-color: #93c5fd; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); }
  .word-search__ico { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 17px; pointer-events: none; }
  .word-search__clear { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); width: 26px; height: 26px; border: none; border-radius: 8px; background: transparent; color: #94a3b8; cursor: pointer; display: none; place-items: center; font-size: 15px; font-family: inherit; }
  .word-search.has-value .word-search__clear { display: grid; }
  .word-search__clear:hover { background: #f1f5f9; color: #475569; }

  .initials { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; background: #ffffff; }
  .initial { min-width: 34px; height: 34px; padding: 0 8px; border: 1px solid var(--line); background: #fff; border-radius: 8px; font-size: 12.5px; font-weight: 700; color: #475569; cursor: pointer; font-family: inherit; transition: 0.12s; }
  .initial:hover { border-color: #93c5fd; color: var(--blue); }
  .initial.is-active { background: var(--blue); border-color: var(--blue); color: #fff; box-shadow: 0 2px 8px rgba(37, 99, 235, 0.28); }
  .initial:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  .word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 7px; max-height: 220px; overflow-y: auto; padding-right: 2px; scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
  .word-grid-empty { grid-column: 1 / -1; text-align: center; padding: 22px 8px; font-size: 13px; font-weight: 600; color: #94a3b8; }
  .wbtn { appearance: none; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 10px 6px; font-size: 13px; font-weight: 700; color: #334155; cursor: pointer; font-family: inherit; transition: 0.12s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wbtn:hover { border-color: #93c5fd; background: var(--blue-light); color: #1d4ed8; }
  .wbtn.is-active { border-color: var(--blue); background: var(--blue); color: #fff; box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3); }
  .wbtn.cat-verb { }
  .wbtn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }


  /* WORD HEADER */
  .word-header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .word-header .word { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; color: var(--text); }
  .word-header .meta { font-size: 13px; color: var(--muted); font-weight: 600; }
  .word-header .badge { font-size: 12px; padding: 4px 12px; border-radius: 99px; background: var(--blue-light); color: var(--blue); font-weight: 800; border: 1px solid #bfdbfe; }

  /* FORM TABS */
  .form-tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--line); margin-bottom: 18px; overflow-x: auto; overflow-y: hidden; }
  .form-tab {
    padding: 11px 20px; border: none; background: transparent; font-size: 14px;
    color: #64748b; cursor: pointer; border-bottom: 2px solid transparent;
    white-space: nowrap; transition: all 0.2s; font-family: inherit; font-weight: 600; margin-bottom: -2px;
  }
  .form-tab:hover { color: var(--blue); }
  .form-tab.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 800; }

  /* TABLE CONTROLS */
  .table-controls { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .table-controls .label { font-size: 13px; color: var(--muted); font-weight: 700; margin-right: 2px; }
  .chip-btn {
    padding: 7px 16px; border: 1px solid #cbd5e1; background: #ffffff;
    border-radius: 99px; font-size: 13px; cursor: pointer; color: #475569; transition: all 0.2s; font-family: inherit; font-weight: 600; box-shadow: var(--shadow2);
  }
  .chip-btn:hover { border-color: #94a3b8; color: var(--text); }
  .chip-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); font-weight: 700; box-shadow: 0 4px 10px rgba(37, 99, 235, 0.15); }
  .spacer { flex: 1; }
  .scroll-hint { font-size: 12px; color: #94a3b8; display: flex; align-items: center; gap: 4px; font-weight: 600; }

  /* ===== 매트릭스 표 ===== */
  .matrix-wrap {
    border: 1px solid var(--line); border-radius: 16px; overflow: auto;
    max-height: 70vh; position: relative; box-shadow: var(--shadow2); background: #ffffff;
  }
  table.matrix { border-collapse: separate; border-spacing: 0; font-size: 14px; width: 100%; }
  table.matrix th, table.matrix td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); white-space: nowrap; }
  table.matrix th:last-child, table.matrix td:last-child { border-right: none; }

  /* 헤더(변이형 열) */
  table.matrix thead th {
    position: sticky; top: 0; z-index: 20; background: #f8fafc;
    padding: 12px 14px; font-weight: 700; text-align: center; color: var(--text);
    font-size: 13px; vertical-align: middle;
  }
  table.matrix thead th .col-count { display: block; font-size: 11px; font-weight: 500; color: #94a3b8; margin-top: 3px; }
  /* 좌상단 코너 */
  table.matrix thead th.corner {
    position: sticky; left: 0; z-index: 30; background: #f8fafc;
    text-align: left; min-width: 116px; box-shadow: 1px 0 0 #cbd5e1;
  }
  /* 변이형 헤더 색상 스와치 */
  .col-swatch { display: inline-block; width: 22px; height: 8px; border-radius: 3px; margin-bottom: 4px; }

  /* 도(道) 구분 행 */
  tr.prov-row td {
    position: sticky; left: 0; z-index: 15;
    background: #f1f5f9; font-weight: 800; font-size: 13px;
    padding: 9px 14px; cursor: pointer; user-select: none; color: var(--text);
    box-shadow: 1px 0 0 #cbd5e1;
  }
  tr.prov-row td .toggle { display: inline-block; font-size: 10px; color: #94a3b8; margin-right: 6px; transition: transform 0.2s; }
  tr.prov-row.collapsed td .toggle { transform: rotate(-90deg); }
  tr.prov-row td .prov-meta { font-weight: 500; color: #94a3b8; font-size: 12px; margin-left: 8px; }
  tr.prov-row td .dom { font-weight: 500; font-size: 12px; margin-left: 8px; color: var(--muted); }

  /* 지역(행) 헤더 셀 - 첫 열 고정 */
  td.rowhead {
    position: sticky; left: 0; z-index: 10; background: #ffffff;
    padding: 10px 14px; font-weight: 700; min-width: 116px; color: var(--text);
    box-shadow: 1px 0 0 var(--line);
  }
  td.rowhead .year { font-size: 11px; color: #94a3b8; font-weight: 500; margin-left: 5px; }
  tbody tr:hover td.rowhead { background: #f8fafc; }

  /* 데이터 셀 */
  td.cell { text-align: center; padding: 0; height: 44px; position: relative; }
  td.cell.filled { cursor: pointer; }
  td.cell .mark {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 100%; font-weight: 700;
    box-shadow: inset 0 0 0 0 transparent; transition: box-shadow 0.15s ease, filter 0.15s ease;
  }
  td.cell.filled:hover .mark { box-shadow: inset 0 0 0 2px rgba(15,23,42,0.28); filter: brightness(0.97); }
  td.cell.empty { background: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(15,23,42,0.02) 5px, rgba(15,23,42,0.02) 6px); }
  td.cell.nodialect { background: #f8fafc; }
  td.cell.nodialect::after { content: "="; color: #94a3b8; font-size: 13px; }

  /* LEGEND */
  .legend-box { margin-bottom: 14px; padding: 16px 18px; background: #f8fafc; border: 1px solid var(--line); border-radius: 16px; font-size: 12.5px; color: var(--muted); box-shadow: var(--shadow2); }
  .legend-row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .legend-row + .legend-row { margin-top: 10px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .legend-swatch { width: 16px; height: 16px; border-radius: 4px; border: 1px solid #cbd5e1; }
  .legend-swatch.empty { background: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(15,23,42,0.02) 5px, rgba(15,23,42,0.02) 6px); border-color: var(--line); }
  .legend-swatch.nodialect { background: #ffffff; display:flex; align-items:center; justify-content:center; color:#94a3b8; }

  /* 상세 레이어 팝업 (모달) */
  .overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 100; display: none; padding: 40px 20px; overflow-y: auto; }
  .overlay.show { display: flex; align-items: center; justify-content: center; animation: vc-fadein 0.2s ease; }
  @keyframes vc-fadein { from { opacity: 0; } to { opacity: 1; } }
  .detail-modal {
    background: #ffffff; border-radius: 24px; border: 1px solid var(--line);
    width: 100%; max-width: 460px; margin: auto;
    box-shadow: 0 20px 40px rgba(15, 23, 42, 0.18); overflow: hidden;
    transform: translateY(8px) scale(0.98); transition: transform 0.2s ease;
  }
  .overlay.show .detail-modal { transform: translateY(0) scale(1); }
  .detail-modal__head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 22px 26px; border-bottom: 1px solid var(--line); background: #f8fafc; }
  .detail-modal__head h2 { font-size: 20px; margin-bottom: 4px; color: var(--text); font-weight: 800; }
  .detail-modal__head .subtitle { font-size: 13px; color: var(--muted); font-weight: 600; }
  .detail-modal .close { flex-shrink: 0; background: #ffffff; border: 1px solid var(--line); border-radius: 12px; width: 36px; height: 36px; font-size: 18px; cursor: pointer; color: var(--muted); line-height: 1; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
  .detail-modal .close:hover { background: #f1f5f9; color: var(--text); }
  .detail-modal__body { padding: 24px 26px; max-height: 65vh; overflow-y: auto; }
  .detail-block { margin-bottom: 18px; }
  .detail-block .k { font-size: 12px; color: #94a3b8; margin-bottom: 6px; font-weight: 800; letter-spacing: 0.02em; }
  .detail-block .v { font-size: 15px; color: var(--text); font-weight: 600; }
  .detail-block .original { background: #f8fafc; border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 1.7; color: var(--text); border-left: 3px solid var(--blue); font-weight: 500; }
  .audio-btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 10px; background: var(--blue); color: #fff; border: none; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 8px; font-family: inherit; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); transition: 0.2s; }
  .audio-btn:hover { background: var(--blue-hover); transform: translateY(-1px); }
  .waveform { display: inline-flex; gap: 2px; align-items: center; height: 16px; }
  .waveform span { width: 2px; background: #fff; border-radius: 1px; }

  .hidden { display: none !important; }
  @media (max-width: 640px) {
    .container { padding: 24px 16px 60px; }
    .sub-visual { padding: 30px 0 26px; }
    .location-bar { flex-wrap: wrap; justify-content: center; row-gap: 2px; padding: 8px 14px; max-width: calc(100% - 32px); }
    .word-header .word { font-size: 22px; }
    .detail-modal { max-width: 100%; }
    table.matrix thead th.corner, td.rowhead { min-width: 92px; }
  }
</style>
</head>
<body>

  <!-- 공통 GNB 헤더 영역 (gnb.js에 의해 동적으로 로드 및 렌더링됩니다) -->
  <div id="gnb-common"></div>

  <div class="sub-visual">
    <div class="wrap">
      <h1 class="sv-title">지역어 변이형 비교</h1>
      <div class="location-bar">
        <div class="loc-item home"><i class="ti ti-home" aria-hidden="true"></i></div>
        <i class="ti ti-chevron-right loc-sep"></i>
        <div class="loc-item">
          <select onchange="if(this.value) location.href=this.value;">
            <option value="./dialect_search_prototype.html" selected>지역어 검색</option>
            <option value="./index.html">누리집 안내</option>
            <option value="./dialect_map.html">지역어 지도</option>
            <option value="./literature_dialect.html">문학 속 지역어</option>
            <option value="./region_culture.html">사진으로 보는 생활어</option>
          </select>
        </div>
        <i class="ti ti-chevron-right loc-sep"></i>
        <div class="loc-item">
          <select onchange="if(this.value) location.href=this.value;">
            <option value="./dialect_variant_compare.html" selected>지역어 변이형 비교</option>
            <option value="./dialect_search_prototype.html">통합자료검색</option>
            <option value="./vocab_dialect.html">어휘조사자료</option>
            <option value="./oral_dialect.html">구술발화조사자료</option>
          </select>
        </div>
      </div>
    </div>
  </div>

<div class="wrap container">

  <div class="pick-panel">
    <div class="catalog is-open" id="catalog">
      <div class="pick-panel__head">
        <p class="pick-panel__label">
          <i class="ti ti-vocabulary" style="color:var(--blue)" aria-hidden="true"></i>
          <span>비교할 표준어</span>
          <span class="pick-panel__count" id="wordCountMeta">—개</span>
        </p>
      </div>
      <div class="catalog__body" id="catalogBody">
        <div class="word-search" id="wordSearchWrap">
          <i class="ti ti-search word-search__ico" aria-hidden="true"></i>
          <input type="search" class="word-search__input" id="wordSearch" placeholder="표준어 검색 (예: 가마솥, 담그다)" autocomplete="off" aria-label="표준어 검색">
          <button type="button" class="word-search__clear" id="wordSearchClear" aria-label="검색어 지우기"><i class="ti ti-x" aria-hidden="true"></i></button>
        </div>
        <div class="initials" id="initials" role="tablist" aria-label="초성 필터"></div>
        <div class="word-grid" id="wordGrid" role="listbox" aria-label="표준어 목록"></div>
      </div>
    </div>
  </div>

  <!-- 단어 미선택 시: 안내(결과 없음) 화면 -->
  <div class="empty-result" id="emptyResult">
    <div class="empty-result__icon"><i class="ti ti-list-search" aria-hidden="true"></i></div>
    <p class="empty-result__title">비교할 표준어를 골라 주세요</p>
    <p class="empty-result__desc">위 목록에서 단어를 선택하면 지역별 방언형을 하나의 표로 비교해 볼 수 있습니다.</p>
  </div>

  <!-- 단어 선택 시: 결과 영역 -->
  <div id="resultArea" hidden>
    <div class="word-header">
      <span class="word" id="currentWord"></span>
      <span class="badge" id="wordCat"></span>
      <span class="meta" id="wordMeta"></span>
    </div>

    <div class="form-tabs" id="formTabs"></div>

    <div class="table-controls">
      <span class="label">정렬</span>
      <button class="chip-btn active" id="sortRegionBtn" onclick="setSort('region')">지역순</button>
      <button class="chip-btn" id="sortVariantBtn" onclick="setSort('variant')">방언형 분포순</button>
      <button class="chip-btn" id="collapseBtn" onclick="toggleAll()">도별 모두 접기</button>
      <div class="spacer"></div>
    </div>

    <div class="legend-box" id="legendBox"></div>

    <div class="matrix-wrap" id="matrixWrap">
      <table class="matrix" id="matrix"></table>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeDetail()">
  <div class="detail-modal" id="detailPanel" role="dialog" aria-modal="true" aria-labelledby="detailWord" onclick="event.stopPropagation()">
    <div class="detail-modal__head">
      <div>
        <h2 id="detailWord"></h2>
        <div class="subtitle" id="detailSub"></div>
      </div>
      <button type="button" class="close" onclick="closeDetail()" aria-label="닫기"><i class="ti ti-x" aria-hidden="true"></i></button>
    </div>
    <div class="detail-modal__body">
      <div class="detail-block"><div class="k">이 지역의 방언형</div><div class="v" id="detailVariant" style="font-size:22px; font-weight:800; color:var(--blue);"></div></div>
      <div class="detail-block"><div class="k">조사 지점 · 연도</div><div class="v" id="detailPlace"></div></div>
      <div class="detail-block"><div class="k">조사 원문</div><div class="original" id="detailOriginal"></div></div>
      <div class="detail-block"><div class="k">발음 듣기</div>
        <button type="button" class="audio-btn" onclick="playAudio()"><span class="waveform" id="waveform"></span> 발음 재생</button>
      </div>
    </div>

/* 변이형 계열 색상 팔레트 (밝은 파스텔 배경 + 진한 글자) */
const COLOR_PALETTE = [
  ["#cfe3f7","#1a4870"],
  ["#d3ecdc","#1f5636"],
  ["#fbe3c0","#7a4a10"],
  ["#f4d4d9","#7a2436"],
  ["#e0d7f2","#46327a"],
  ["#f9d9c9","#7a3818"],
  ["#d5ecec","#205050"],
  ["#eae0c4","#5f4e18"]
];

let state = { word:null, form:"기본형", mode:"general", sort:"region", collapsed:{}, allCollapsed:false };

// 한 지점의 검토 결과에 두 개 이상의 형태가 있으면 각각을 별도 계열(열)로 취급한다.
// 각 형태는 rec.cells[].v(대표형) 로 열에 매칭되고, 방언형 없음/기저형 없음은 표준어(=)로 표시한다.
function stemsOf(rec){
  if(rec.note==="not_surveyed") return [];
  if(rec.note==="no_dialect") return [];               // '=' 는 별도 계열을 만들지 않음
  return (rec.cells||[]).map(c=>c.v);
}

let colorMap={}, stemOrder=[], stemCount={};
function buildColorMap(){
  const fd=DATA[state.word].forms[state.form];
  stemCount={}; stemOrder=[];
  PROVINCES.forEach(p=>(fd[p]||[]).forEach(r=>{
    stemsOf(r).forEach(s=>{
      if(!(s in stemCount)){stemCount[s]=0;stemOrder.push(s);}
      stemCount[s]++;
    });
  }));
  stemOrder.sort((a,b)=>stemCount[b]-stemCount[a]);
  colorMap={};
  stemOrder.forEach((s,i)=>colorMap[s]=COLOR_PALETTE[i%COLOR_PALETTE.length]);
}
function colorFor(v){
  const c=colorMap[v]||["#f1f5f9","#64748b"];
  return {bg:c[0], fg:c[1]};
}

/* 열(변이형 계열) 목록: 분포 많은 순 */
function getColumns(){
  return stemOrder.map(s=>({stem:s, label:s, count:stemCount[s]}));
}

function render(){
  const hasWord=!!state.word && !!DATA[state.word];
  document.getElementById("emptyResult").hidden=hasWord;
  document.getElementById("resultArea").hidden=!hasWord;
  if(!hasWord) return;
  buildColorMap();
  renderWordHeader();
  renderFormTabs();
  renderMatrix();
  renderLegend();
}
function renderWordHeader(){
  const w=DATA[state.word];
  document.getElementById("currentWord").textContent=state.word;
  document.getElementById("wordCat").textContent=w.cat;
  const fd=w.forms[state.form];
  let pts=0,prov=0;
  PROVINCES.forEach(p=>{if(fd[p]&&fd[p].length){prov++;pts+=fd[p].length;}});
  const cols=getColumns().length;
  const provNames=PROVINCES.filter(p=>fd[p]&&fd[p].length).join(", ");
  document.getElementById("wordMeta").textContent=`조사 지역 ${provNames} · 조사지점 ${pts}곳 · 방언형 ${cols}계열`;
}
function renderFormTabs(){
  const forms=Object.keys(DATA[state.word].forms);
  const wrap=document.getElementById("formTabs"); wrap.innerHTML="";
  forms.forEach(f=>{
    const b=document.createElement("button");
    b.className="form-tab"+(f===state.form?" active":"");
    b.textContent=f==="기본형"?"기본형":`조사 ${f}`;
    b.onclick=()=>{state.form=f;render();};
    wrap.appendChild(b);
  });
}

function renderMatrix(){
  const fd=DATA[state.word].forms[state.form];
  const cols=getColumns();
  const stdCol=cols.find(c=>c.stem===state.word)||cols[0];   // no_dialect(=) 표시용 표준어형 열
  const table=document.getElementById("matrix");
  table.innerHTML="";

  // 헤더
  const thead=document.createElement("thead");
  const htr=document.createElement("tr");
  const corner=document.createElement("th");
  corner.className="corner";
  corner.innerHTML=`지역 <span class="col-count">${state.sort==="variant"?"방언형 분포순":"지역순"}</span>`;
  htr.appendChild(corner);
  cols.forEach(c=>{
    const th=document.createElement("th");
    const col=colorFor(c.label);
    th.innerHTML=`<span class="col-swatch" style="background:${col.bg}"></span><br>${c.label}<span class="col-count">${c.count}곳</span>`;
    htr.appendChild(th);
  });
  thead.appendChild(htr);
  table.appendChild(thead);

  // 바디
  const tbody=document.createElement("tbody");
  let provList=[...PROVINCES];

  provList.forEach(prov=>{
    const records=fd[prov];
    if(!records||!records.length)return;

    // 도 대표 방언형 (가장 많이 나온 형태)
    const dc={};
    records.forEach(r=>stemsOf(r).forEach(s=>{dc[s]=(dc[s]||0)+1;}));
    let domStem=null,dm=0; for(const s in dc)if(dc[s]>dm){dm=dc[s];domStem=s;}

    // 도 구분 행
    const collapsed=state.collapsed[prov];
    const provTr=document.createElement("tr");
    provTr.className="prov-row"+(collapsed?" collapsed":"");
    const provTd=document.createElement("td");
    provTd.colSpan=cols.length+1;
    const domSwatch = domStem ? `<span class="dom">주로 <b style="color:var(--text)">${domStem}</b></span>` : "";
    provTd.innerHTML=`<span class="toggle">▼</span>${prov}<span class="prov-meta">${records.length}개 지점</span>${domSwatch}`;
    provTd.onclick=()=>{state.collapsed[prov]=!state.collapsed[prov];renderMatrix();};
    provTr.appendChild(provTd);
    tbody.appendChild(provTr);

    if(collapsed)return;

    let recs=[...records];
    if(state.sort==="variant"){
      const idx=r=>{const s=stemsOf(r); return s.length?stemOrder.indexOf(s[0]):999;};
      recs.sort((a,b)=>{
        const ia=idx(a), ib=idx(b);
        if(ia!==ib)return ia-ib;
        return (a.point).localeCompare(b.point);
      });
    }

    recs.forEach(rec=>{
      const tr=document.createElement("tr");
      const rh=document.createElement("td");
      rh.className="rowhead";
      rh.innerHTML=`${rec.point}<span class="year">${rec.year}</span>`;
      tr.appendChild(rh);

      cols.forEach(c=>{
        const td=document.createElement("td");
        td.className="cell";
        if(rec.note==="not_surveyed"){
          td.classList.add("empty");
          td.title="미조사 지점";
        } else if(rec.note==="no_dialect"){
          // 방언형/기저형 없음: 표준어와 동일. 표준어형 열(없으면 첫 열)에만 '=' 표시
          if(c===stdCol){
            td.classList.add("nodialect");
            td.title=(rec.display||"방언형 없음")+" · 표준어와 동일";
          }
        } else {
          const cell=(rec.cells||[]).find(x=>x.v===c.stem);
          if(cell){
            td.classList.add("filled");
            const col=colorFor(c.stem);
            const mark=document.createElement("span");
            mark.className="mark";
            mark.style.background=col.bg;
            mark.style.color=col.fg;
            mark.textContent=cell.full;
            td.appendChild(mark);
            td.onclick=()=>openDetail(prov,rec);
          }
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  });

  table.appendChild(tbody);
}

function renderLegend(){
  const box=document.getElementById("legendBox");
  const cols=getColumns();
  const items=cols.map(c=>{
    const col=colorFor(c.label);
    return `<div class="legend-item"><div class="legend-swatch" style="background:${col.bg}"></div><span>${c.label} 계열 (${c.count}곳)</span></div>`;
  }).join("");
  box.innerHTML=`
    <div class="legend-row"><b style="color:var(--text)">방언형 계열</b> ${items}</div>
    <div class="legend-row"><b style="color:var(--text)">빈 칸</b>
      <div class="legend-item"><div class="legend-swatch nodialect">=</div><span>방언형 없음 (표준어와 동일)</span></div>
      <div class="legend-item"><div class="legend-swatch empty"></div><span>미조사 지점</span></div>
    </div>`;
}

function openDetail(prov,rec){
  document.getElementById("detailWord").textContent=`${state.word} · ${state.form==="기본형"?"기본형":"조사 "+state.form}`;
  document.getElementById("detailSub").textContent=`${prov} ${rec.point}`;
  document.getElementById("detailVariant").textContent=rec.display||rec.variant;
  document.getElementById("detailPlace").textContent=`${prov} ${rec.point} · ${rec.year}년 조사`;
  document.getElementById("detailOriginal").textContent=rec.original||"(원문 정보 없음)";
  document.getElementById("overlay").classList.add("show");
  buildWaveform();
}
function closeDetail(){
  document.getElementById("overlay").classList.remove("show");
}
function buildWaveform(){
  const wf=document.getElementById("waveform");wf.innerHTML="";
  for(let i=0;i<14;i++){const s=document.createElement("span");s.style.height=(5+Math.round(Math.random()*11))+"px";wf.appendChild(s);}
}
function playAudio(){
  document.querySelectorAll("#waveform span").forEach((s,i)=>setTimeout(()=>{s.style.height=(5+Math.round(Math.random()*11))+"px";},i*40));
}

function setSort(s){
  state.sort=s;
  document.getElementById("sortRegionBtn").classList.toggle("active",s==="region");
  document.getElementById("sortVariantBtn").classList.toggle("active",s==="variant");
  renderMatrix();
}
function toggleAll(){
  state.allCollapsed=!state.allCollapsed;
  PROVINCES.forEach(p=>state.collapsed[p]=state.allCollapsed);
  document.getElementById("collapseBtn").textContent=state.allCollapsed?"도별 모두 펼치기":"도별 모두 접기";
  renderMatrix();
}

/* ── 단어 선택 목록 (초성 필터 + 검색) ── */
const ALL_WORDS = Object.keys(DATA);
const wordGrid = document.getElementById("wordGrid");
const initialsBox = document.getElementById("initials");
const wordSearch = document.getElementById("wordSearch");
const wordSearchWrap = document.getElementById("wordSearchWrap");
const wordSearchClear = document.getElementById("wordSearchClear");
let searchQuery = "";
let initialFilter = "all";

function getInitial(ch){
  const code = ch.charCodeAt(0);
  if(code < 0xac00 || code > 0xd7a3) return "기타";
  const list = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
  return list[Math.floor((code - 0xac00) / 588)] || "기타";
}
const INIT_ORDER = ["전체","ㄱ","ㄴ","ㄷ","ㄹ","ㅁ","ㅂ","ㅅ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
INIT_ORDER.forEach(ini=>{
  const b=document.createElement("button");
  b.type="button";
  b.className="initial"+(ini==="전체"?" is-active":"");
  b.textContent=ini;
  b.dataset.ini=ini==="전체"?"all":ini;
  b.setAttribute("role","tab");
  initialsBox.appendChild(b);
});

function renderWordGrid(){
  const q=searchQuery.trim();
  const cmap={"ㄲ":"ㄱ","ㄸ":"ㄷ","ㅃ":"ㅂ","ㅆ":"ㅅ","ㅉ":"ㅈ"};
  const filtered=ALL_WORDS.filter(w=>{
    if(q && !w.includes(q)) return false;
    if(initialFilter==="all") return true;
    const ini=getInitial(w[0]);
    return (cmap[ini]||ini)===initialFilter;
  });
  document.getElementById("wordCountMeta").textContent=`${filtered.length}개`;
  if(!filtered.length){
    wordGrid.innerHTML=`<div class="word-grid-empty">검색 결과가 없어요. 다른 단어나 초성을 골라 보세요.</div>`;
    return;
  }
  wordGrid.innerHTML=filtered.map(w=>{
    const active=w===state.word;
    return `<button type="button" class="wbtn${active?" is-active":""}" data-word="${w}" role="option" aria-selected="${active}" title="${w} (${DATA[w].cat})">${w}</button>`;
  }).join("");
}

wordGrid.addEventListener("click",e=>{
  const btn=e.target.closest("[data-word]");
  if(!btn) return;
  selectWord(btn.dataset.word);
});
initialsBox.addEventListener("click",e=>{
  const btn=e.target.closest(".initial");
  if(!btn) return;
  initialFilter=btn.dataset.ini;
  initialsBox.querySelectorAll(".initial").forEach(b=>b.classList.toggle("is-active",b===btn));
  renderWordGrid();
});
function syncSearchUI(){ wordSearchWrap.classList.toggle("has-value",!!searchQuery.trim()); }
wordSearch.addEventListener("input",()=>{ searchQuery=wordSearch.value||""; syncSearchUI(); renderWordGrid(); });
wordSearchClear.addEventListener("click",()=>{ searchQuery=""; wordSearch.value=""; syncSearchUI(); renderWordGrid(); wordSearch.focus(); });

function selectWord(w){
  if(!DATA[w]) return;
  state.word=w; state.form=Object.keys(DATA[w].forms)[0]; state.collapsed={};
  render();
  renderWordGrid();
}

render();
renderWordGrid();
</script>
</body>
</html>
