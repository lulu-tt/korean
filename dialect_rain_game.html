<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>방언 소나기 — 국립국어원</title>
<!-- 시안: 초등 5-2 국어 「표준어와 방언을 알아봐요」 마무리 놀이. 떨어지는 방언 빗방울의 표준어를 입력(또는 선택)해 터뜨린다.
     낱말 짝은 지역어 지도 자료(data/processed/map/{번호}.json)의 방언형을 그대로 불러온다(조사 지점 8곳 이상인 형태만).
     이 페이지가 가진 것은 '어떤 표제어를 쓰고, 어떤 형태는 뺄지'(WORDS)뿐이다. -->
<link rel="shortcut icon" href="./favicon.ico">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="./styles.css">
<script src="./gnb.js" defer></script>
<script src="./footer.js" defer></script>
<style>
/* 모든 클래스는 rg- 접두사로 스코프 */
.rg-page { max-width: 1080px; margin: 0 auto; padding: 32px 20px 80px; }
.rg-head { position: relative; overflow: hidden; border-radius: 24px; padding: 28px 32px; margin-bottom: 24px; background: linear-gradient(120deg, #dbeafe 0%, #e0f2fe 50%, #ede9fe 100%); }
.rg-head::after { content: ''; position: absolute; width: 170px; height: 170px; border-radius: 50%; right: -40px; top: -60px; background: #93c5fd; opacity: .5; }
.rg-head > * { position: relative; z-index: 1; }
.rg-eyebrow { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; color: #1d4ed8; background: #fff; padding: 5px 12px; border-radius: 999px; box-shadow: 0 2px 0 rgba(29,78,216,.15); }
.rg-title { display: flex; align-items: center; gap: 10px; font-size: 34px; font-weight: 900; letter-spacing: -0.03em; margin: 12px 0 6px; color: #1e293b; }
.rg-title i { font-size: 38px; color: #2563eb; transform: rotate(-8deg); }
.rg-sub { color: #475569; font-size: 16px; margin: 0; font-weight: 600; }
.rg-panel { background: #fff; border: 2px solid #eef2f7; border-radius: 24px; box-shadow: 0 8px 30px rgba(15,23,42,.06); padding: 30px; }
.rg-panel[hidden] { display: none; }
.rg-q { font-size: 22px; font-weight: 900; margin: 0 0 12px; color: #1e293b; }
.rg-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 46px; padding: 0 18px; border-radius: 14px; border: 2px solid #e2e8f0; background: #fff; color: #1e293b; font: inherit; font-size: 15px; font-weight: 800; cursor: pointer; text-decoration: none; box-shadow: 0 3px 0 #e2e8f0; }
.rg-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #e2e8f0; }
.rg-btn:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
.rg-btn i { font-size: 20px; }
.rg-btn--primary { background: #2563eb; border-color: #2563eb; color: #fff; box-shadow: 0 4px 0 #1e3a8a; }
.rg-btn--lg { height: 60px; font-size: 19px; padding: 0 30px; border-radius: 18px; }
.rg-btn:disabled { opacity: .5; cursor: not-allowed; }

/* 시작 화면 */
.rg-setup { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.rg-choices { display: grid; gap: 10px; }
.rg-choice { display: flex; align-items: center; gap: 14px; text-align: left; border: 3px solid #e2e8f0; border-radius: 18px; padding: 14px 16px; background: #fff; font: inherit; cursor: pointer; }
.rg-choice[aria-pressed="true"] { border-color: #2563eb; background: #eff6ff; }
.rg-choice:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
.rg-choice i { font-size: 34px; color: #3b82f6; flex: none; }
.rg-choice b { display: block; font-size: 18px; font-weight: 900; color: #1e293b; }
.rg-choice span { font-size: 14px; color: #64748b; font-weight: 600; }
.rg-start { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 26px; }
.rg-start small { color: #64748b; font-weight: 700; }

/* 놀이 화면: 비 오는 마을 */
.rg-stage { position: relative; height: 560px; border-radius: 24px; overflow: hidden; background: linear-gradient(#94a3b8 0%, #cbd5e1 45%, #e2e8f0 100%); user-select: none; touch-action: manipulation; }
.rg-stage.is-calm { background: linear-gradient(#bae6fd 0%, #e0f2fe 60%, #f0f9ff 100%); }
.rg-cloud { position: absolute; top: -20px; height: 70px; border-radius: 999px; background: #f8fafc; opacity: .9; box-shadow: 40px 10px 0 -6px #f8fafc, -40px 12px 0 -10px #f8fafc; }
.rg-streak { position: absolute; top: -40px; width: 2px; height: 26px; background: rgba(255,255,255,.55); border-radius: 2px; animation: rg-streak linear infinite; }
.rg-hud { position: absolute; left: 14px; right: 14px; top: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; z-index: 5; }
.rg-hud__box { background: rgba(255,255,255,.88); border-radius: 999px; padding: 6px 14px; font-weight: 900; font-size: 15px; color: #1e293b; display: inline-flex; align-items: center; gap: 6px; }
.rg-rainbow { width: 180px; height: 12px; border-radius: 6px; background: rgba(255,255,255,.7); overflow: hidden; }
.rg-rainbow span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ef4444, #f59e0b, #eab308, #22c55e, #3b82f6, #6366f1, #a855f7); transition: width .3s; }
.rg-pause { width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(255,255,255,.88); font-size: 20px; cursor: pointer; }
.rg-drop { position: absolute; top: 0; left: 0; z-index: 3; transform: translate(-50%, 0); display: flex; flex-direction: column; align-items: center; pointer-events: none; }
.rg-drop__body { position: relative; min-width: 84px; padding: 16px 16px 12px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: linear-gradient(160deg, #e0f2fe, #7dd3fc); border: 3px solid #fff; box-shadow: 0 6px 14px rgba(14,116,144,.25); text-align: center; }
.rg-drop__body::before { content: ''; position: absolute; left: 50%; top: -16px; transform: translateX(-50%); border: 12px solid transparent; border-bottom: 18px solid #fff; border-top: 0; }
.rg-drop__word { font-size: 21px; font-weight: 900; color: #0c4a6e; white-space: nowrap; }
.rg-drop__hint { font-size: 13px; font-weight: 800; color: #0369a1; margin-top: 2px; }
.rg-drop.is-target .rg-drop__body { background: linear-gradient(160deg, #fef9c3, #fde047); }
.rg-drop.is-target .rg-drop__word { color: #713f12; }
.rg-pop { position: absolute; z-index: 4; transform: translate(-50%, -50%); pointer-events: none; font-weight: 900; font-size: 18px; color: #1e3a8a; background: #fff; padding: 6px 12px; border-radius: 999px; box-shadow: 0 4px 10px rgba(15,23,42,.15); animation: rg-float 1.3s ease-out forwards; white-space: nowrap; }
.rg-burst { position: absolute; z-index: 4; width: 10px; height: 10px; border-radius: 50%; background: #7dd3fc; pointer-events: none; animation: rg-burst .5s ease-out forwards; }
.rg-village { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; z-index: 2; background: linear-gradient(#86efac, #4ade80); display: flex; justify-content: space-around; align-items: flex-end; padding: 0 30px 70px; }
.rg-village::before { content: ''; position: absolute; left: 0; right: 0; top: -30px; height: 40px; background: radial-gradient(circle at 20% 100%, #4ade80 40px, transparent 41px), radial-gradient(circle at 60% 100%, #22c55e 55px, transparent 56px), radial-gradient(circle at 90% 100%, #4ade80 38px, transparent 39px); }
.rg-umb { position: relative; font-size: 46px; line-height: 1; transition: transform .3s; }
.rg-umb.is-closed { transform: rotate(160deg) scale(.7); opacity: .35; filter: grayscale(1); }
.rg-u0 { color: #ef4444; } .rg-u1 { color: #f59e0b; } .rg-u2 { color: #22c55e; } .rg-u3 { color: #3b82f6; } .rg-u4 { color: #a855f7; }
.rg-inputbar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; padding: 12px 16px; display: flex; gap: 10px; justify-content: center; }
.rg-input { width: min(420px, 100%); height: 52px; border-radius: 16px; border: 3px solid #fff; box-shadow: 0 4px 0 rgba(15,23,42,.15); padding: 0 16px; font: inherit; font-size: 22px; font-weight: 800; text-align: center; }
.rg-input:focus { outline: none; border-color: #2563eb; }
.rg-input.is-no { border-color: #ef4444; animation: rg-shake .3s; }
.rg-taps { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.rg-tap { min-width: 110px; height: 54px; border-radius: 16px; border: none; font: inherit; font-size: 21px; font-weight: 900; cursor: pointer; background: #fff; color: #1e293b; box-shadow: 0 4px 0 rgba(15,23,42,.15); padding: 0 16px; }
.rg-tap:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(15,23,42,.15); }
.rg-tap.is-no { background: #fecaca; animation: rg-shake .3s; }
.rg-overlay { position: absolute; inset: 0; z-index: 8; display: flex; align-items: center; justify-content: center; background: rgba(15,23,42,.45); }
.rg-overlay[hidden] { display: none; }
.rg-overlay__box { background: #fff; border-radius: 22px; padding: 26px 30px; text-align: center; max-width: 420px; }
.rg-overlay__box h3 { margin: 0 0 8px; font-size: 24px; font-weight: 900; }
.rg-overlay__box p { margin: 0 0 16px; color: #475569; font-weight: 700; }
.rg-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* 결과 */
.rg-result-top { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 18px; }
.rg-score { font-size: 54px; font-weight: 900; color: #2563eb; line-height: 1; }
.rg-result-top p { margin: 0; font-size: 17px; font-weight: 800; color: #334155; }
.rg-met { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.rg-met a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px; border-radius: 14px; background: #f0f9ff; text-decoration: none; color: #0c4a6e; font-weight: 900; font-size: 17px; border: 2px solid #e0f2fe; }
.rg-met a.is-miss { background: #fff7ed; border-color: #fed7aa; color: #9a3412; }
.rg-met a small { font-size: 12px; font-weight: 800; opacity: .7; }
.rg-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
.rg-loading { color: #64748b; padding: 30px 0; text-align: center; font-weight: 700; }
.rg-warn { background: #fffbeb; border: 2px solid #fde68a; color: #92400e; border-radius: 14px; padding: 12px 14px; font-size: 15px; font-weight: 700; margin-bottom: 16px; }
.rg-proto { margin-top: 28px; font-size: 13px; color: #94a3b8; line-height: 1.6; }

@keyframes rg-streak { from { transform: translateY(0) rotate(12deg); } to { transform: translateY(640px) rotate(12deg); } }
@keyframes rg-float { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.7); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); } 100% { opacity: 0; transform: translate(-50%, -160%) scale(1); } }
@keyframes rg-burst { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
@keyframes rg-shake { 0%, 100% { transform: translateX(0); } 33% { transform: translateX(-6px); } 66% { transform: translateX(6px); } }

@media (max-width: 860px) {
  .rg-head { padding: 22px 20px; }
  .rg-title { font-size: 27px; }
  .rg-panel { padding: 20px 14px; }
  .rg-setup { grid-template-columns: 1fr; }
  .rg-stage { height: 70vh; min-height: 460px; }
  .rg-rainbow { width: 90px; }
  .rg-drop__word { font-size: 18px; }
  .rg-tap { min-width: 90px; font-size: 18px; }
  .rg-met { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rg-umb { font-size: 36px; }
}
@media (prefers-reduced-motion: reduce) {
  .rg-streak, .rg-burst { display: none; }
  .rg-pop { animation-duration: .01s; }
}
</style>
</head>
<body>
<div id="gnb-common"></div>

<main class="rg-page">
  <header class="rg-head">
    <span class="rg-eyebrow"><i class="ti ti-school"></i>초등 5학년 국어 · 표준어와 방언을 알아봐요</span>
    <h1 class="rg-title"><i class="ti ti-cloud-rain" aria-hidden="true"></i>방언 소나기</h1>
    <p class="rg-sub">방언 빗방울이 떨어져요! 바닥에 닿기 전에 표준어로 바꿔서 터뜨려 보세요.</p>
  </header>

  <!-- 시작 -->
  <section class="rg-panel" id="rg-setup-panel">
    <div class="rg-setup">
      <div>
        <h2 class="rg-q">비가 얼마나 올까요?</h2>
        <div class="rg-choices" id="rg-level">
          <button type="button" class="rg-choice" data-v="easy" aria-pressed="true"><i class="ti ti-droplet"></i><span><b>이슬비</b><span>천천히 하나씩, 첫 글자 힌트가 있어요</span></span></button>
          <button type="button" class="rg-choice" data-v="mid" aria-pressed="false"><i class="ti ti-cloud-rain"></i><span><b>소나기</b><span>조금 빠르게, 힌트 없이</span></span></button>
          <button type="button" class="rg-choice" data-v="hard" aria-pressed="false"><i class="ti ti-cloud-storm"></i><span><b>장대비</b><span>여러 개가 한꺼번에 쏟아져요</span></span></button>
        </div>
      </div>
      <div>
        <h2 class="rg-q">어떻게 터뜨릴까요?</h2>
        <div class="rg-choices" id="rg-mode">
          <button type="button" class="rg-choice" data-v="tap" aria-pressed="true"><i class="ti ti-hand-finger"></i><span><b>누르기</b><span>아래 보기 중에서 표준어를 눌러요 (태블릿 추천)</span></span></button>
          <button type="button" class="rg-choice" data-v="type" aria-pressed="false"><i class="ti ti-keyboard"></i><span><b>타자</b><span>표준어를 치고 Enter를 눌러요</span></span></button>
        </div>
      </div>
    </div>
    <div class="rg-start">
      <button type="button" class="rg-btn rg-btn--primary rg-btn--lg" id="rg-go" disabled><i class="ti ti-umbrella"></i>비 내리기 시작</button>
      <small id="rg-ready">낱말을 모으는 중이에요…</small>
    </div>
  </section>

  <!-- 놀이 -->
  <section class="rg-panel" id="rg-play-panel" hidden style="padding:14px">
    <div class="rg-stage" id="rg-stage">
      <div class="rg-hud">
        <span class="rg-hud__box"><i class="ti ti-droplet-filled" style="color:#0ea5e9"></i><span id="rg-score">0</span>개</span>
        <span class="rg-hud__box"><span class="rg-rainbow" title="무지개 점수"><span id="rg-bow"></span></span><span id="rg-lv">1단계</span></span>
        <span style="display:inline-flex;gap:8px">
          <button type="button" class="rg-pause" id="rg-pause" aria-label="잠깐 멈추기" title="잠깐 멈추기"><i class="ti ti-player-pause-filled"></i></button>
          <button type="button" class="rg-pause" id="rg-quit" aria-label="그만하고 처음 화면으로" title="처음 화면으로"><i class="ti ti-home"></i></button>
        </span>
      </div>
      <div id="rg-sky"></div>
      <div class="rg-village" id="rg-village"></div>
      <div class="rg-inputbar" id="rg-inputbar"></div>
      <div class="rg-overlay" id="rg-overlay" hidden><div class="rg-overlay__box"><h3>잠깐 쉬어요</h3><p>준비되면 다시 시작해요.</p><span style="display:inline-flex;gap:8px;flex-wrap:wrap;justify-content:center"><button type="button" class="rg-btn" id="rg-quit2"><i class="ti ti-home"></i>처음 화면으로</button><button type="button" class="rg-btn rg-btn--primary" id="rg-resume"><i class="ti ti-player-play-filled"></i>계속하기</button></span></div></div>
      <p class="rg-sr" aria-live="polite" id="rg-live"></p>
    </div>
  </section>

  <!-- 결과 -->
  <section class="rg-panel" id="rg-result-panel" hidden>
    <div class="rg-result-top">
      <span class="rg-score" id="rg-final">0</span>
      <p id="rg-final-msg"></p>
    </div>
    <h2 class="rg-q">오늘 만난 방언</h2>
    <div class="rg-met" id="rg-met"></div>
    <div class="rg-actions">
      <button type="button" class="rg-btn" id="rg-again-setup"><i class="ti ti-settings"></i>단계 바꾸기</button>
      <button type="button" class="rg-btn rg-btn--primary" id="rg-again"><i class="ti ti-refresh"></i>한 번 더</button>
      <a class="rg-btn" href="./dialect_grandma_story.html"><i class="ti ti-message-heart"></i>할머니 말 이야기</a>
    </div>
  </section>

  <p class="rg-proto">시안 안내 · 빗방울의 방언은 국립국어원 지역어 조사 '지역어 지도' 자료에서 조사 지점이 8곳 이상인 방언형만 가져왔습니다. 낱말을 누르면 지역어 지도에서 어디서 쓰는 말인지 볼 수 있어요.</p>
</main>

<div id="footer-common"></div>

  // ── 낱말 짝 모으기: 표제어(표준어) ↔ 지점 8곳 이상 방언형 ──
  var PAIRS = [], STDS = [];
  function loadPairs() {
    return Promise.all(WORDS.map(function (w) {
      return getJSON(MAP_URL + w.no + '.json').then(function (m) {
        var skip = w.skip || [];
        Object.keys(m.groups || {}).forEach(function (gk) {
          (m.groups[gk].variants || []).forEach(function (v) {
            if (v.word === m.headword || (v.n || 0) < MIN_SITES || skip.indexOf(v.word) !== -1 || /\s/.test(v.word)) return;
            PAIRS.push({ dia: v.word, std: m.headword, no: w.no, n: v.n });
          });
        });
        STDS.push(m.headword);
      }).catch(function () {});
    }));
  }

  // ── 시작 화면 ──
  var opt = { level: 'easy', mode: 'tap' };
  function bindChoice(id, key) {
    $(id).addEventListener('click', function (e) {
      var b = e.target.closest('[data-v]'); if (!b) return;
      opt[key] = b.dataset.v;
      this.querySelectorAll('[data-v]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    });
  }
  bindChoice('rg-level', 'level'); bindChoice('rg-mode', 'mode');
  function show(id) { ['rg-setup-panel', 'rg-play-panel', 'rg-result-panel'].forEach(function (p) { $(p).hidden = (p !== id); }); }

  // ── 놀이 ──
  var G = null;
  function start() {
    show('rg-play-panel');
    var stage = $('rg-stage');
    stage.classList.remove('is-calm');
    $('rg-sky').innerHTML = '';
    // 구름·빗줄기 장식
    var deco = '';
    for (var c = 0; c < 4; c++) deco += '<span class="rg-cloud" style="left:' + (c * 27 + 4) + '%;width:' + (120 + c * 20) + 'px"></span>';
    for (var s = 0; s < 26; s++) deco += '<span class="rg-streak" style="left:' + Math.random() * 100 + '%;animation-duration:' + (0.6 + Math.random() * 0.6) + 's;animation-delay:' + (-Math.random()) + 's"></span>';
    $('rg-sky').innerHTML = deco;
    $('rg-village').innerHTML = Array.apply(null, Array(LIVES)).map(function (_, i) { return '<i class="ti ti-umbrella-filled rg-umb rg-u' + i + '" aria-hidden="true"></i>'; }).join('');
    G = { lv: LEVELS[opt.level], drops: [], score: 0, lives: LIVES, met: {}, last: 0, spawnAt: 0, t: 0, paused: false, deck: shuffle(PAIRS.slice()), stage: 1, raf: 0 };
    renderInput();
    $('rg-score').textContent = '0'; $('rg-bow').style.width = '0%'; $('rg-lv').textContent = '1단계';
    G.last = performance.now();
    G.raf = requestAnimationFrame(tick);
  }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function nextPair() {
    if (!G.deck.length) G.deck = shuffle(PAIRS.slice());
    // 화면에 이미 같은 표준어가 있으면 피한다(타자로 구분이 안 되므로)
    for (var i = 0; i < G.deck.length; i++) {
      var p = G.deck[i];
      if (!G.drops.some(function (d) { return d.p.std === p.std; })) { G.deck.splice(i, 1); return p; }
    }
    return G.deck.shift();
  }
  function hint(std) { return std.charAt(0) + Array(std.length).join('○'); }

  function spawn() {
    var p = nextPair();
    var el = document.createElement('div');
    el.className = 'rg-drop';
    el.innerHTML = '<div class="rg-drop__body"><div class="rg-drop__word">' + esc(p.dia) + '</div>' + (G.lv.hint ? '<div class="rg-drop__hint">' + esc(hint(p.std)) + '</div>' : '') + '</div>';
    $('rg-sky').appendChild(el);
    var w = $('rg-stage').clientWidth;
    var d = { p: p, el: el, x: 70 + Math.random() * (w - 140), y: -70, v: G.lv.speed * (1 + (G.stage - 1) * 0.12) * (0.85 + Math.random() * 0.3) };
    G.drops.push(d);
    place(d);
    retarget();
  }
  function place(d) { d.el.style.transform = 'translate(' + (d.x - d.el.offsetWidth / 2) + 'px,' + d.y + 'px)'; }
  function lowest() { return G.drops.slice().sort(function (a, b) { return b.y - a.y; })[0]; }
  // 누르기 모드: 가장 아래 빗방울을 노란색으로 표시하고 그 보기를 아래에 보여 준다
  function retarget() {
    var lo = lowest();
    G.drops.forEach(function (d) { d.el.classList.toggle('is-target', opt.mode === 'tap' && d === lo); });
    if (opt.mode === 'tap') renderTaps(lo);
  }

  function tick(now) {
    if (!G) return;
    var dt = Math.min(0.05, (now - G.last) / 1000); G.last = now;
    if (!G.paused) {
      G.t += dt * 1000;
      var floor = $('rg-stage').clientHeight - 150;
      if (G.drops.length < G.lv.max && G.t >= G.spawnAt) { spawn(); G.spawnAt = G.t + G.lv.gap / (1 + (G.stage - 1) * 0.1); }
      for (var i = G.drops.length - 1; i >= 0; i--) {
        var d = G.drops[i];
        d.y += d.v * dt;
        place(d);
        if (d.y > floor) miss(d);
      }
    }
    if (G && G.lives > 0) G.raf = requestAnimationFrame(tick);
  }

  function remove(d) { d.el.remove(); G.drops.splice(G.drops.indexOf(d), 1); }
  function hit(d) {
    var r = d.el.getBoundingClientRect(), s = $('rg-stage').getBoundingClientRect();
    var cx = r.left - s.left + r.width / 2, cy = r.top - s.top + r.height / 2;
    burst(cx, cy);
    var pop = document.createElement('div');
    pop.className = 'rg-pop'; pop.style.left = cx + 'px'; pop.style.top = cy + 'px';
    pop.textContent = d.p.dia + ' = ' + d.p.std;
    $('rg-sky').appendChild(pop); setTimeout(function () { pop.remove(); }, 1400);
    $('rg-live').textContent = d.p.dia + '는 ' + d.p.std;
    G.met[d.p.dia] = { p: d.p, ok: true };
    remove(d);
    G.score++;
    $('rg-score').textContent = G.score;
    var inStage = G.score % 10;
    $('rg-bow').style.width = (inStage * 10) + '%';
    if (inStage === 0) { G.stage++; $('rg-lv').textContent = G.stage + '단계'; $('rg-bow').style.width = '100%'; setTimeout(function () { if (G) $('rg-bow').style.width = '0%'; }, 400); }
    retarget();
  }
  function burst(x, y) {
    for (var i = 0; i < 8; i++) {
      var b = document.createElement('span');
      var a = i / 8 * Math.PI * 2;
      b.className = 'rg-burst'; b.style.left = x + 'px'; b.style.top = y + 'px';
      b.style.setProperty('--dx', Math.cos(a) * 46 + 'px'); b.style.setProperty('--dy', Math.sin(a) * 46 + 'px');
      $('rg-sky').appendChild(b); setTimeout(function (el) { return function () { el.remove(); }; }(b), 520);
    }
  }
  function miss(d) {
    if (!G.met[d.p.dia]) G.met[d.p.dia] = { p: d.p, ok: false };
    remove(d);
    G.lives--;
    var u = $('rg-village').children[LIVES - 1 - G.lives];
    if (u) u.classList.add('is-closed');
    $('rg-live').textContent = '놓쳤어요. ' + d.p.dia + '는 ' + d.p.std + '. 우산 ' + G.lives + '개 남음';
    retarget();
    if (G.lives <= 0) end();
  }

  // ── 입력 ──
  function renderInput() {
    var bar = $('rg-inputbar');
    if (opt.mode === 'type') {
      bar.innerHTML = '<input class="rg-input" id="rg-input" type="text" autocomplete="off" enterkeyhint="done" placeholder="표준어를 치고 Enter" aria-label="표준어를 치고 Enter를 누르세요">';
      var inp = $('rg-input');
      // 표준어를 다 치고 Enter를 눌러야 판정한다(치는 도중에는 터지지 않음).
      // 한글 조합 중에 Enter를 누르면 조합이 끝난 뒤(compositionend) 판정하고 칸을 비운다.
      var enterPending = false;
      var submit = function () {
        if (!G) return;
        var v = inp.value.replace(/\s/g, '');
        inp.value = '';
        if (!v) return;
        var d = G.drops.filter(function (x) { return x.p.std === v; }).sort(function (a, b) { return b.y - a.y; })[0];
        if (d) hit(d);
        else { inp.classList.remove('is-no'); void inp.offsetWidth; inp.classList.add('is-no'); }
        // 조합이 끝나며 글자가 되살아나는 브라우저가 있어 한 번 더 비운다
        setTimeout(function () { inp.value = ''; }, 0);
      };
      inp.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        if (e.isComposing || e.keyCode === 229) { enterPending = true; return; }
        submit();
      });
      inp.addEventListener('compositionend', function () {
        if (enterPending) { enterPending = false; setTimeout(submit, 0); }
      });
      setTimeout(function () { inp.focus(); }, 50);
    } else {
      bar.innerHTML = '<div class="rg-taps" id="rg-taps"></div>';
      $('rg-taps').addEventListener('click', function (e) {
        var b = e.target.closest('[data-std]'); if (!b || G.paused) return;
        var lo = lowest(); if (!lo) return;
        if (b.dataset.std === lo.p.std) hit(lo);
        else { b.classList.remove('is-no'); void b.offsetWidth; b.classList.add('is-no'); }
      });
    }
  }
  function renderTaps(lo) {
    var box = $('rg-taps'); if (!box) return;
    if (!lo) { box.innerHTML = ''; box.dataset.for = ''; return; }
    if (box.dataset.for === lo.p.dia) return;   // 같은 빗방울이면 보기 순서를 유지
    box.dataset.for = lo.p.dia;
    var others = shuffle(STDS.filter(function (s) { return s !== lo.p.std; })).slice(0, 2);
    box.innerHTML = shuffle([lo.p.std].concat(others)).map(function (s) { return '<button type="button" class="rg-tap" data-std="' + esc(s) + '">' + esc(s) + '</button>'; }).join('');
  }

  // ── 멈춤·끝 ──
  function pause(on) {
    if (!G) return;
    G.paused = on; $('rg-overlay').hidden = !on;
    if (!on) { G.last = performance.now(); var inp = $('rg-input'); if (inp) inp.focus(); }
  }
  $('rg-pause').addEventListener('click', function () { pause(true); });
  $('rg-resume').addEventListener('click', function () { pause(false); });
  // 그만하고 처음(단계·방법 고르기) 화면으로: 놀이를 멈추고 빗방울을 치운다
  function quit() {
    if (G) { cancelAnimationFrame(G.raf); G = null; }
    $('rg-overlay').hidden = true;
    $('rg-sky').innerHTML = '';
    $('rg-inputbar').innerHTML = '';
    show('rg-setup-panel');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  $('rg-quit').addEventListener('click', quit);
  $('rg-quit2').addEventListener('click', quit);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && G && !$('rg-play-panel').hidden) pause(!G.paused); });
  document.addEventListener('visibilitychange', function () { if (document.hidden && G) pause(true); });

  function end() {
    cancelAnimationFrame(G.raf);
    var g = G; G = null;
    $('rg-stage').classList.add('is-calm');
    $('rg-final').textContent = g.score;
    $('rg-final-msg').innerHTML = (g.score >= 20 ? '와, 방언 박사예요!' : g.score >= 10 ? '잘했어요! 방언과 많이 친해졌어요.' : '비가 그쳤어요. 다시 해 볼까요?') +
      '<br><span style="font-size:14px;color:#64748b">빗방울을 ' + g.score + '개 터뜨렸어요 · ' + g.stage + '단계까지 갔어요</span>';
    var list = Object.keys(g.met).map(function (k) { return g.met[k]; });
    $('rg-met').innerHTML = list.length ? list.map(function (m) {
      return '<a class="' + (m.ok ? '' : 'is-miss') + '" href="./dialect_map.html?no=' + encodeURIComponent(m.p.no) + '" title="지역어 지도에서 보기">' +
        '<span>' + esc(m.p.dia) + ' → ' + esc(m.p.std) + '</span><small>' + (m.ok ? '터뜨림' : '놓침') + '</small></a>';
    }).join('') : '<p class="rg-loading">이번엔 만난 방언이 없어요.</p>';
    setTimeout(function () { show('rg-result-panel'); window.scrollTo({ top: 0, behavior: 'smooth' }); }, 700);
  }
  $('rg-go').addEventListener('click', start);
  $('rg-again').addEventListener('click', start);
  $('rg-again-setup').addEventListener('click', function () { show('rg-setup-panel'); });

  // ── 시작 ──
  if (!/^https?:$/.test(location.protocol)) {
    var warn = document.createElement('p');
    warn.className = 'rg-warn';
    warn.innerHTML = '미리보기로 열려서, 저장해 둔 자료 사본으로 보여 드려요. 최신 자료와 전체 메뉴는 개발 서버 주소에서 볼 수 있어요: <a href="http://127.0.0.1:8765/dialect_rain_game.html">http://127.0.0.1:8765/dialect_rain_game.html</a>';
    document.querySelector('.rg-head').after(warn);
  }
  loadPairs().then(function () {
    if (PAIRS.length < 5) { $('rg-ready').textContent = '낱말을 불러오지 못했어요. 개발 서버 주소로 열어 주세요.'; return; }
    $('rg-go').disabled = false;
    $('rg-ready').textContent = '방언 ' + PAIRS.length + '개가 준비됐어요 (표준어 ' + STDS.length + '개)';
  });
})();
</script>
</body>
</html>
