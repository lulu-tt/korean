<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- GNB, 본문 정렬 기준선인 1440px 가로폭 고정 및 페이지 전환 시 흔들림 방지 뷰포트 선언 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>페이지 제목 — 국립국어원</title>

<!-- 파비콘 및 폰트 아이콘 설정 -->
<link rel="shortcut icon" href="./favicon.ico">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">

<!-- 공통 스타일시트 로드 (scrollbar-gutter: stable 및 기본 Pretendard 폰트 내장) -->
<link rel="stylesheet" href="./styles.css">
<!-- 퍼블리싱 디자인 CSS + 브리지.
     순서가 중요하다: styles.css 뒤, 페이지 인라인 <style> 앞이다.
     공통 셸(GNB/푸터)은 디자인이 이기고, 이름이 겹치는 본문 쪽은 인라인 <style> 이 이긴다.
     디자인이 본문까지 덮어 버리는 것들(.wrap/.container/body 기본값 등)은 브리지에서 되돌린다. -->
<link rel="stylesheet" href="./publishing/assets/ko/css/style.css">
<link rel="stylesheet" href="./design-bridge.css">

<!-- 공통 GNB 및 Footer 동적 로더 스크립트 (defer 선언 필수) -->
<script src="./gnb.js" defer></script>
<script src="./footer.js" defer></script>

<style>
  /* 해당 페이지 전용 개별 커스텀 스타일이 필요할 때만 작성합니다. */
  /* GNB 관련 스타일(.topbar, .nav, .mega-menu 등)은 절대 이곳에 중복 기재하지 마세요. */
</style>
<!-- 공통 셸 동작(GNB 드롭다운, 모바일 전체메뉴, 내 정보 팝업).
     gnb.js/footer.js 가 마크업을 넣은 뒤 초기화돼야 하므로 반드시 그 뒤에 둔다.
     (셋 다 defer 라 문서 순서대로 실행되고, 셋 다 DOMContentLoaded 에서 동작한다.) -->
<script src="./publishing/assets/_common/js/ui-global.js" defer></script>
</head>
<body>

  <!-- 공통 GNB 헤더 영역 (gnb.js에 의해 동적으로 로드 및 렌더링됩니다) -->
  <div id="gnb-common"></div>

  <!-- 본문 컨테이너 영역 (공통 styles.css 규격을 상속받아 최대 가로폭 1440px에 맞춰집니다) -->
  <main class="container">
    <div style="padding: 100px 0; text-align: center;">
      <h2 style="font-size: 32px; font-weight: 700; margin-bottom: 16px;">새로운 페이지 본문</h2>
      <p style="color: #64748b; font-size: 16px;">이곳에 페이지의 핵심 비즈니스 로직과 본문 마크업을 자유롭게 구현하세요.</p>
    </div>
  </main>

  <!-- 공통 Footer 영역 (footer.js에 의해 동적으로 로드 및 렌더링됩니다) -->
  <div id="footer-common"></div>

</body>
</html>
